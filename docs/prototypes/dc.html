<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Service Center — DC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --red:#C8102E; --red-dark:#9C0C22; --red-tint:#FBE7E9;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EEE6;
  --border:#E4DED2; --border-strong:#D2C9B8;
  --text:#2B2723; --text-2:#6B6459; --text-mute:#9A9384;
  --green:#1D9E75; --green-tint:#E1F5EE;
  --amber:#BA7517; --amber-tint:#FAEEDA;
  --blue:#185FA5; --blue-tint:#E6F1FB;
  --teal:#0F6E56; --teal-tint:#E1F5EE;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.brand-mark{width:32px;height:32px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
.brand-name{font-weight:600;font-size:15px;}
main{max-width:1180px;margin:0 auto;padding:24px 20px;}
.page-title{font-size:20px;font-weight:600;margin:0 0 4px;}
.page-sub{font-size:13px;color:var(--text-2);margin:0 0 20px;}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:4px;}
.daterange{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);}

.overdue-summary{display:flex;align-items:center;gap:14px;background:var(--red-tint);border:1px solid var(--red);border-radius:12px;padding:14px 18px;margin-bottom:18px;cursor:pointer;font-family:inherit;width:100%;text-align:left;}
.overdue-summary .num{font-size:28px;font-weight:600;color:var(--red-dark);}
.overdue-summary .lbl{font-size:13px;color:var(--red-dark);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;font-family:inherit;}
.kpi-card:hover{border-color:var(--border-strong);}
.kpi-card .num{font-size:26px;font-weight:600;line-height:1.1;color:var(--text);}
.kpi-card .lbl{font-size:12px;color:var(--text-2);margin-top:4px;}
.kpi-card .over-lbl{font-size:11.5px;color:var(--red-dark);margin-top:3px;font-weight:500;}

.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{font-family:inherit;font-size:13.5px;padding:9px 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:8px;}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
.tab-count{background:var(--surface-2);color:var(--text);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600;}
.tab-btn.active .tab-count{background:rgba(255,255,255,.25);color:#fff;}

.filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0;margin-bottom:16px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-2);font-weight:500;font-size:12px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border-strong);white-space:nowrap;cursor:pointer;user-select:none;}
th .arrow{font-size:10px;color:var(--text-mute);margin-left:3px;}
th.nosort{cursor:default;}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.done-row td{opacity:.55;}
input{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);width:100%;}
.btn{font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red);}
.btn-primary:hover{background:var(--red-dark);}
.btn-primary:disabled{background:var(--border-strong);border-color:var(--border-strong);color:var(--text-mute);cursor:not-allowed;}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;white-space:nowrap;}
.b-gray{background:var(--surface-2);color:var(--text-2);}
.b-blue{background:var(--blue-tint);color:var(--blue);}
.b-amber{background:var(--amber-tint);color:var(--amber);}
.b-green{background:var(--green-tint);color:var(--green);}
.b-teal{background:var(--teal-tint);color:var(--teal);}
.b-red{background:var(--red-tint);color:var(--red-dark);}
.jobid-over{color:var(--red-dark);}
.photo-toggle{border:1px dashed var(--border-strong);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text-mute);display:inline-block;}
.photo-toggle.done{border-style:solid;border-color:var(--green);color:var(--green);background:var(--green-tint);}
.empty{padding:36px;text-align:center;color:var(--text-mute);font-size:13px;}
.action-stack{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.action-row{display:flex;gap:6px;}

#overdue-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:80;padding:24px;}
.modal-box{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto;padding:22px 24px;position:relative;}
.close-btn{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--text-mute);cursor:pointer;}
</style>
</head>
<body>
<div class="topbar"><div class="brand-mark">SC</div><div class="brand-name">Service Center — DC</div></div>

<main>
  <div class="toprow">
    <div>
      <p class="page-title" style="margin-bottom:2px">ส่วนงาน DC</p>
      <p class="page-sub" style="margin-bottom:0">เข้ารับจากสาขา → รับเข้า Location → ส่งมอบให้ VD → รับคืนจาก VD → ส่งคืนกลับสาขา</p>
    </div>
    <div class="daterange">
      <label>ตั้งแต่</label><input type="date" id="date-start" value="2026-09-01" onchange="onDateChange()">
      <label>ถึง</label><input type="date" id="date-end" value="2026-09-12" onchange="onDateChange()">
      <button class="btn btn-primary" onclick="exportExcel()">Export เป็น Excel</button>
    </div>
  </div>

  <button class="overdue-summary" onclick="openOverdueModal()">
    <div class="num" id="overdue-total">0</div>
    <div class="lbl">รายการเกิน SLA ทั้งหมด — กดเพื่อดูรายละเอียดและดำเนินการ</div>
  </button>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="tabs" id="tabs"></div>
  <div id="tab-content"></div>
</main>

<div id="overdue-modal">
  <div class="modal-box">
    <button class="close-btn" onclick="document.getElementById('overdue-modal').style.display='none'">✕</button>
    <h3 style="margin:0 0 12px;font-size:15px">รายการเกิน SLA ทั้งหมด</h3>
    <table>
      <tr><th class="nosort">เลขที่ใบแจ้งซ่อม</th><th class="nosort">สาขา/ปลายทาง</th><th class="nosort">สินค้า</th><th class="nosort">ขั้นตอนที่ค้าง</th><th class="nosort">เกินมา</th><th class="nosort"></th></tr>
      <tbody id="overdue-rows"></tbody>
    </table>
  </div>
</div>

<script>
const SLA = {pickup:24, receiveDC:4, handoffVD:24, returnFromVD:24, dispatchBranch:24};
const branches = ['บางนา','รังสิต','แจ้งวัฒนะ','พระราม 2','เชียงใหม่'];

let pickupQueue = [
  {id:'JB-2609-08410', branch:'บางนา', customer:'สมชาย ใจดี', product:'สว่านไฟฟ้า Bosch', hoursWaiting:5, dispatched:false, notified:false, done:false, date:'2026-09-11'},
  {id:'JB-2609-08405', branch:'รังสิต', customer:'วิภา รักเรียน', product:'เครื่องปั่น Xiaomi', hoursWaiting:30, dispatched:false, notified:false, done:false, date:'2026-09-09'},
  {id:'JB-2609-08398', branch:'แจ้งวัฒนะ', customer:'กนกวรรณ สายทอง', product:'พัดลม Philips', hoursWaiting:10, dispatched:false, notified:false, done:false, date:'2026-09-10'},
];
let receiveDCQueue = [
  {id:'JB-2609-08380', branch:'พระราม 2', customer:'ธีรพงษ์ ศรีสุข', product:'เตารีด Philips', location:'', hoursWaiting:2, done:false, date:'2026-09-11'},
  {id:'JB-2609-08375', branch:'เชียงใหม่', customer:'นภาพร ทองใบ', product:'สว่านไฟฟ้า Bosch', location:'', hoursWaiting:6, done:false, date:'2026-09-10'},
];
let handoffVDQueue = [
  {id:'JB-2609-08360', branch:'บางนา', customer:'ปิยะพงษ์ แก้วมณี', product:'เครื่องดูดฝุ่น Xiaomi', vdCode:'VD-0091', photo:false, hoursWaiting:30, done:false, date:'2026-09-08'},
];
let returnFromVDQueue = [
  {id:'JB-2609-08210', branch:'รังสิต', customer:'สุนิสา บุญมี', product:'สว่านไฟฟ้า Makita', vdCode:'VD-0091', photo:false, hoursWaiting:10, done:false, date:'2026-09-09'},
];
let dispatchBranchQueue = []; // populated after receiving return from VD

function pending(list){ return list.filter(x=>!x.done).length; }
function overdueCountOf(list, sla){ return list.filter(x=>!x.done && x.hoursWaiting>sla).length; }

let activeTab = 'pickup';
const tabDefs = [
  {key:'pickup', label:'เข้ารับจากสาขา', count:()=>pending(pickupQueue)},
  {key:'receiveDC', label:'รับเข้า Location', count:()=>pending(receiveDCQueue)},
  {key:'handoffVD', label:'ส่งมอบให้ VD', count:()=>pending(handoffVDQueue)},
  {key:'returnFromVD', label:'รับคืนจาก VD', count:()=>pending(returnFromVDQueue)},
  {key:'dispatchBranch', label:'ส่งคืนกลับสาขา', count:()=>pending(dispatchBranchQueue)},
];
const kpiDefs = [
  {tab:'pickup', label:'รอเข้ารับจากสาขา', count:()=>pending(pickupQueue), over:()=>overdueCountOf(pickupQueue,SLA.pickup)},
  {tab:'receiveDC', label:'รอรับเข้า Location', count:()=>pending(receiveDCQueue), over:()=>overdueCountOf(receiveDCQueue,SLA.receiveDC)},
  {tab:'handoffVD', label:'รอส่งมอบให้ VD', count:()=>pending(handoffVDQueue), over:()=>overdueCountOf(handoffVDQueue,SLA.handoffVD)},
  {tab:'returnFromVD', label:'รอรับคืนจาก VD', count:()=>pending(returnFromVDQueue), over:()=>overdueCountOf(returnFromVDQueue,SLA.returnFromVD)},
  {tab:'dispatchBranch', label:'รอส่งคืนกลับสาขา', count:()=>pending(dispatchBranchQueue), over:()=>overdueCountOf(dispatchBranchQueue,SLA.dispatchBranch)},
];

function collectOverdue(){
  const out = [];
  pickupQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.pickup) out.push({id:j.id, place:j.branch, product:j.product, stage:'เข้ารับจากสาขา', tabKey:'pickup', over:j.hoursWaiting-SLA.pickup}); });
  receiveDCQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.receiveDC) out.push({id:j.id, place:j.branch, product:j.product, stage:'รับเข้า Location', tabKey:'receiveDC', over:j.hoursWaiting-SLA.receiveDC}); });
  handoffVDQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.handoffVD) out.push({id:j.id, place:j.vdCode, product:j.product, stage:'ส่งมอบให้ VD', tabKey:'handoffVD', over:j.hoursWaiting-SLA.handoffVD}); });
  returnFromVDQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.returnFromVD) out.push({id:j.id, place:j.vdCode, product:j.product, stage:'รับคืนจาก VD', tabKey:'returnFromVD', over:j.hoursWaiting-SLA.returnFromVD}); });
  dispatchBranchQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.dispatchBranch) out.push({id:j.id, place:j.branch, product:j.product, stage:'ส่งคืนกลับสาขา', tabKey:'dispatchBranch', over:j.hoursWaiting-SLA.dispatchBranch}); });
  out.sort((a,b)=>b.over-a.over);
  return out;
}
function renderOverdueSummary(){ document.getElementById('overdue-total').textContent = collectOverdue().length; }
function openOverdueModal(){
  const list = collectOverdue();
  document.getElementById('overdue-rows').innerHTML = list.length ? list.map(o=>`
    <tr><td><b>${o.id}</b></td><td>${o.place}</td><td>${o.product}</td><td>${o.stage}</td>
    <td><span class="badge b-red">เกิน ${o.over} ชม.</span></td>
    <td><button class="btn btn-primary" onclick="goToJobAction('${o.tabKey}')">ไปดำเนินการ</button></td></tr>`).join('')
    : `<tr><td colspan="6" style="text-align:center;color:var(--text-mute);padding:20px">ไม่มีงานเกิน SLA ในขณะนี้</td></tr>`;
  document.getElementById('overdue-modal').style.display='flex';
}
function goToJobAction(tabKey){ document.getElementById('overdue-modal').style.display='none'; setTab(tabKey); }

function renderKpis(){
  document.getElementById('kpi-grid').innerHTML = kpiDefs.map(k=>`
    <button class="kpi-card" onclick="setTab('${k.tab}')">
      <div class="num">${k.count()}</div>
      <div class="lbl">${k.label}</div>
      ${k.over()>0 ? `<div class="over-lbl">เกิน SLA: ${k.over()} งาน</div>` : ''}
    </button>`).join('');
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = tabDefs.map(t=>`
    <button class="tab-btn ${activeTab===t.key?'active':''}" onclick="setTab('${t.key}')">
      ${t.label} <span class="tab-count">${t.count()}</span>
    </button>`).join('');
}
function setTab(key){ activeTab = key; renderAll(); }
function renderAll(){ renderOverdueSummary(); renderKpis(); renderTabs(); renderContent(); populateBranchFilter(); }

const sortStates = { pickup:{key:null,dir:1}, receiveDC:{key:null,dir:1}, handoffVD:{key:null,dir:1}, returnFromVD:{key:null,dir:1}, dispatchBranch:{key:null,dir:1} };
function toggleSort(table, key){
  const st = sortStates[table];
  if(st.key===key) st.dir *= -1; else { st.key=key; st.dir=1; }
  renderContent();
}
function sortedCopy(list, table){
  const st = sortStates[table];
  if(!st.key) return list;
  const copy = [...list];
  copy.sort((a,b)=>{
    let av=a[st.key], bv=b[st.key];
    if(typeof av==='number') return (av-bv)*st.dir;
    return String(av).localeCompare(String(bv),'th')*st.dir;
  });
  return copy;
}
function th(table, key, label){
  const st = sortStates[table];
  const arrow = st.key===key ? (st.dir===1?'▲':'▼') : '';
  return `<th onclick="toggleSort('${table}','${key}')">${label}<span class="arrow">${arrow}</span></th>`;
}

let branchFilter = '';
let dateStart = '2026-09-01';
let dateEnd = '2026-09-12';
function onDateChange(){
  dateStart = document.getElementById('date-start').value;
  dateEnd = document.getElementById('date-end').value;
  renderContent();
}
function inDateRange(item){
  if(!item.date) return true;
  if(dateStart && item.date < dateStart) return false;
  if(dateEnd && item.date > dateEnd) return false;
  return true;
}
function exportExcel(){
  const sheets = [
    {name:'เข้ารับจากสาขา', list:pickupQueue, cols:['id','branch','customer','product','hoursWaiting','dispatched','done','date']},
    {name:'รับเข้า Location', list:receiveDCQueue, cols:['id','branch','customer','product','location','hoursWaiting','done','date']},
    {name:'ส่งมอบให้ VD', list:handoffVDQueue, cols:['id','customer','product','vdCode','hoursWaiting','done','date']},
    {name:'รับคืนจาก VD', list:returnFromVDQueue, cols:['id','customer','product','vdCode','hoursWaiting','done','date']},
    {name:'ส่งคืนกลับสาขา', list:dispatchBranchQueue, cols:['id','branch','customer','product','dispatched','done','date']},
  ];
  const wb = XLSX.utils.book_new();
  sheets.forEach(s=>{
    const filtered = s.list.filter(inDateRange);
    const rows = filtered.map(j=>{
      const row = {};
      s.cols.forEach(c=>row[c]=j[c]);
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(rows.length?rows:[{}]);
    XLSX.utils.book_append_sheet(wb, ws, s.name);
  });
  XLSX.writeFile(wb, 'service_center_dc.xlsx');
}
function populateBranchFilter(){
  const el = document.getElementById('branch-filter');
  if(!el) return;
  el.innerHTML = '<option value="">ทุกสาขา</option>' + branches.map(b=>`<option ${b===branchFilter?'selected':''}>${b}</option>`).join('');
}
function setBranchFilter(v){ branchFilter = v; renderContent(); }

function togglePhoto(list, id){ const item = list.find(x=>x.id===id); item.photo = !item.photo; renderContent(); }
function refreshBtn(btnId, item){ const btn = document.getElementById(btnId); if(btn) btn.disabled = !(item.photo && (item.location===undefined || item.location)); }

function slaTag(hoursWaiting, sla){
  return `${hoursWaiting} ชม.<div style="font-size:11px;color:${hoursWaiting>sla?'var(--red-dark)':'var(--text-mute)'}">SLA ${sla} ชม.${hoursWaiting>sla?' — เกิน':''}</div>`;
}
function jid(j, sla){
  return `<b class="${!j.done && j.hoursWaiting>sla ? 'jobid-over':''}">${j.id}</b>`;
}

function renderContent(){
  const el = document.getElementById('tab-content');
  if(activeTab==='pickup') return el.innerHTML = renderPickup();
  if(activeTab==='receiveDC') return el.innerHTML = renderReceiveDC();
  if(activeTab==='handoffVD') return el.innerHTML = renderHandoffVD();
  if(activeTab==='returnFromVD') return el.innerHTML = renderReturnFromVD();
  if(activeTab==='dispatchBranch') return el.innerHTML = renderDispatchBranch();
}

// ---- TAB 1: pickup from branch (choose Print/Link, then confirm notified) ----
function renderPickup(){
  let list = pickupQueue;
  if(branchFilter) list = list.filter(j=>j.branch===branchFilter);
  list = list.filter(inDateRange);
  list = sortedCopy(list, 'pickup');
  const filterBar = `<div class="filter-bar"><select id="branch-filter" onchange="setBranchFilter(this.value)"></select></div>`;
  if(!list.length) return filterBar + `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>` + (function(){populateBranchFilter();return '';})();
  const rows = list.map((j)=>{
    let actionCell;
    if(j.done) actionCell = '<span class="badge b-green">แจ้งคนรถแล้ว</span>';
    else if(!j.dispatched) actionCell = `<div class="action-row">
        <button class="btn" onclick="printForDriver('${j.id}')">Print เอกสารให้คนรถ</button>
        <button class="btn" onclick="sendLinkDriver('${j.id}')">ส่ง Link ให้คนรถ</button>
      </div>`;
    else actionCell = `<button class="btn btn-primary" onclick="confirmNotified('${j.id}')">ยืนยัน: แจ้งคนรถแล้ว</button>`;
    return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.pickup)}</td><td>${j.branch}</td><td>${j.customer}</td><td>${j.product}</td>
      <td>${slaTag(j.hoursWaiting,SLA.pickup)}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join('');
  return filterBar + `<div class="card"><table>
    <tr>${th('pickup','id','เลขที่ใบแจ้งซ่อม')}${th('pickup','branch','สาขา')}${th('pickup','customer','ลูกค้า')}${th('pickup','product','สินค้า')}${th('pickup','hoursWaiting','รอมาแล้ว')}<th class="nosort">สถานะ / Action</th></tr>
    ${rows}
  </table></div>`;
}
function printForDriver(id){
  const j = pickupQueue.find(x=>x.id===id);
  j.dispatched = true;
  alert(`พิมพ์เอกสารรับงานสำหรับคนรถ — ${j.id} (${j.branch})`);
  renderContent();
}
function sendLinkDriver(id){
  const j = pickupQueue.find(x=>x.id===id);
  j.dispatched = true;
  alert(`ส่ง Link งานให้คนรถทางมือถือแล้ว — ${j.id} (${j.branch})`);
  renderContent();
}
function confirmNotified(id){
  const j = pickupQueue.find(x=>x.id===id);
  j.done = true;
  receiveDCQueue.push({id:j.id, branch:j.branch, customer:j.customer, product:j.product, location:'', hoursWaiting:0, done:false, date:j.date});
  renderAll();
}

// ---- TAB 2: receive into DC location ----
function renderReceiveDC(){
  const filtered = receiveDCQueue.filter(inDateRange);
  if(!filtered.length) return `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>`;
  const list = sortedCopy(filtered, 'receiveDC');
  return `<div class="card"><table>
    <tr>${th('receiveDC','id','เลขที่ใบแจ้งซ่อม')}${th('receiveDC','branch','สาขาต้นทาง')}${th('receiveDC','customer','ลูกค้า')}${th('receiveDC','product','สินค้า')}${th('receiveDC','hoursWaiting','เวลาที่ค้าง')}<th class="nosort">เลขที่ Location</th><th class="nosort">สถานะ</th></tr>
    ${list.map((j)=>{ const i=receiveDCQueue.indexOf(j); return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.receiveDC)}</td><td>${j.branch}</td><td>${j.customer}</td><td>${j.product}</td>
      <td>${slaTag(j.hoursWaiting,SLA.receiveDC)}</td>
      <td>${j.done ? j.location : `<input value="${j.location}" placeholder="เช่น D-02-01" oninput="receiveDCQueue[${i}].location=this.value; refreshBtn('rdc-btn-${j.id}', receiveDCQueue[${i}])">`}</td>
      <td>${j.done ? '<span class="badge b-green">รับเข้าแล้ว</span>' : `<button class="btn btn-primary" id="rdc-btn-${j.id}" ${!j.location?'disabled':''} onclick="confirmReceiveDC('${j.id}')">ยืนยันรับเข้า Location</button>`}</td>
    </tr>`;}).join('')}
  </table></div>`;
}
function confirmReceiveDC(id){
  const j = receiveDCQueue.find(x=>x.id===id);
  j.done = true;
  handoffVDQueue.push({id:j.id, branch:j.branch, customer:j.customer, product:j.product, vdCode:'VD-0091', photo:false, hoursWaiting:0, done:false, date:j.date});
  renderAll();
}

// ---- TAB 3: hand off to VD (photo + clear location) ----
function renderHandoffVD(){
  const filtered = handoffVDQueue.filter(inDateRange);
  if(!filtered.length) return `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>`;
  const list = sortedCopy(filtered, 'handoffVD');
  return `<div class="card"><table>
    <tr>${th('handoffVD','id','เลขที่ใบแจ้งซ่อม')}${th('handoffVD','customer','ลูกค้า')}${th('handoffVD','product','สินค้า')}${th('handoffVD','vdCode','VD ที่มารับ')}${th('handoffVD','hoursWaiting','เวลาที่ค้าง')}<th class="nosort">ถ่ายภาพ</th><th class="nosort">สถานะ</th></tr>
    ${list.map((j)=>{ const i=handoffVDQueue.indexOf(j); return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.handoffVD)}</td><td>${j.customer}</td><td>${j.product}</td><td>${j.vdCode}</td>
      <td>${slaTag(j.hoursWaiting,SLA.handoffVD)}</td>
      <td>${j.done ? '✓' : `<span class="photo-toggle ${j.photo?'done':''}" onclick="togglePhoto(handoffVDQueue,'${j.id}'); refreshBtn('hvd-btn-${j.id}', handoffVDQueue[${i}])">${j.photo?'✓ ถ่ายแล้ว':'📷 ถ่ายภาพ'}</span>`}</td>
      <td>${j.done ? '<span class="badge b-green">ส่งมอบแล้ว — Location clear</span>' : `<button class="btn btn-primary" id="hvd-btn-${j.id}" ${!j.photo?'disabled':''} onclick="confirmHandoffVD('${j.id}')">ยืนยันส่งมอบ + Clear Location</button>`}</td>
    </tr>`;}).join('')}
  </table></div>`;
}
function confirmHandoffVD(id){
  const j = handoffVDQueue.find(x=>x.id===id);
  j.done = true;
  renderAll();
}

// ---- TAB 4: receive return from VD (photo) ----
function renderReturnFromVD(){
  const filtered = returnFromVDQueue.filter(inDateRange);
  if(!filtered.length) return `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>`;
  const list = sortedCopy(filtered, 'returnFromVD');
  return `<div class="card"><table>
    <tr>${th('returnFromVD','id','เลขที่ใบแจ้งซ่อม')}${th('returnFromVD','customer','ลูกค้า')}${th('returnFromVD','product','สินค้า')}${th('returnFromVD','vdCode','VD ที่ส่งคืนมา')}${th('returnFromVD','hoursWaiting','เวลาที่ค้าง')}<th class="nosort">ถ่ายภาพ</th><th class="nosort">สถานะ</th></tr>
    ${list.map((j)=>{ const i=returnFromVDQueue.indexOf(j); return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.returnFromVD)}</td><td>${j.customer}</td><td>${j.product}</td><td>${j.vdCode}</td>
      <td>${slaTag(j.hoursWaiting,SLA.returnFromVD)}</td>
      <td>${j.done ? '✓' : `<span class="photo-toggle ${j.photo?'done':''}" onclick="togglePhoto(returnFromVDQueue,'${j.id}'); refreshBtn('rfv-btn-${j.id}', returnFromVDQueue[${i}])">${j.photo?'✓ ถ่ายแล้ว':'📷 ถ่ายภาพ'}</span>`}</td>
      <td>${j.done ? '<span class="badge b-green">รับคืนแล้ว</span>' : `<button class="btn btn-primary" id="rfv-btn-${j.id}" ${!j.photo?'disabled':''} onclick="confirmReturnFromVD('${j.id}')">ยืนยันรับคืนจาก VD</button>`}</td>
    </tr>`;}).join('')}
  </table></div>`;
}
function confirmReturnFromVD(id){
  const j = returnFromVDQueue.find(x=>x.id===id);
  j.done = true;
  dispatchBranchQueue.push({id:j.id, branch:j.branch, customer:j.customer, product:j.product, dispatched:false, done:false, hoursWaiting:0, date:j.date});
  renderAll();
}

// ---- TAB 5: dispatch back to branch ----
function renderDispatchBranch(){
  const filtered = dispatchBranchQueue.filter(inDateRange);
  if(!filtered.length) return `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>`;
  const list = sortedCopy(filtered, 'dispatchBranch');
  const rows = list.map((j)=>{
    let actionCell;
    if(j.done) actionCell = '<span class="badge b-green">ส่งคืนกลับสาขาแล้ว — รอ GR รับที่สาขา</span>';
    else if(!j.dispatched) actionCell = `<div class="action-row">
        <button class="btn" onclick="printForDriverReturn('${j.id}')">Print เอกสารให้คนรถ</button>
        <button class="btn" onclick="sendLinkDriverReturn('${j.id}')">ส่ง Link ให้คนรถ</button>
      </div>`;
    else actionCell = `<button class="btn btn-primary" onclick="confirmDispatchDone('${j.id}')">ยืนยัน: จัดส่งออกจาก DC แล้ว</button>`;
    return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.dispatchBranch)}</td><td>${j.branch}</td><td>${j.customer}</td><td>${j.product}</td>
      <td>${slaTag(j.hoursWaiting,SLA.dispatchBranch)}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join('');
  return `<div class="card"><table>
    <tr>${th('dispatchBranch','id','เลขที่ใบแจ้งซ่อม')}${th('dispatchBranch','branch','สาขาปลายทาง')}${th('dispatchBranch','customer','ลูกค้า')}${th('dispatchBranch','product','สินค้า')}${th('dispatchBranch','hoursWaiting','เวลาที่ค้าง')}<th class="nosort">สถานะ / Action</th></tr>
    ${rows}
  </table></div>`;
}
function printForDriverReturn(id){ const j = dispatchBranchQueue.find(x=>x.id===id); j.dispatched=true; alert(`พิมพ์เอกสารส่งคืนสำหรับคนรถ — ${j.id} (ปลายทาง ${j.branch})`); renderContent(); }
function sendLinkDriverReturn(id){ const j = dispatchBranchQueue.find(x=>x.id===id); j.dispatched=true; alert(`ส่ง Link งานส่งคืนให้คนรถแล้ว — ${j.id} (ปลายทาง ${j.branch})`); renderContent(); }
function confirmDispatchDone(id){
  const j = dispatchBranchQueue.find(x=>x.id===id);
  j.done = true;
  renderAll();
}

renderAll();
</script>
</body>
</html>
