<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Service Center — GR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E; --red-dark:#9C0C22; --red-tint:#FBE7E9;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EEE6;
  --border:#E4DED2; --border-strong:#D2C9B8;
  --text:#2B2723; --text-2:#6B6459; --text-mute:#9A9384;
  --green:#1D9E75; --green-tint:#E1F5EE;
  --amber:#BA7517; --amber-tint:#FAEEDA;
  --blue:#185FA5; --blue-tint:#E6F1FB;
  --coral:#D85A30; --coral-tint:#FAECE7;
  --teal:#0F6E56; --teal-tint:#E1F5EE;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.brand-mark{width:32px;height:32px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
.brand-name{font-weight:600;font-size:15px;}
main{max-width:1180px;margin:0 auto;padding:24px 20px;}
.page-title{font-size:20px;font-weight:600;margin:0 0 4px;}
.page-sub{font-size:13px;color:var(--text-2);margin:0 0 20px;}

.overdue-summary{display:flex;align-items:center;gap:14px;background:var(--red-tint);border:1px solid var(--red);border-radius:12px;padding:14px 18px;margin-bottom:18px;cursor:pointer;font-family:inherit;width:100%;text-align:left;}
.overdue-summary .num{font-size:28px;font-weight:600;color:var(--red-dark);}
.overdue-summary .lbl{font-size:13px;color:var(--red-dark);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;font-family:inherit;}
.kpi-card:hover{border-color:var(--border-strong);}
.kpi-card .num{font-size:26px;font-weight:600;line-height:1.1;color:var(--text);}
.kpi-card .lbl{font-size:12px;color:var(--text-2);margin-top:4px;}
.kpi-card .over-lbl{font-size:11.5px;color:var(--red-dark);margin-top:3px;font-weight:500;}

.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{font-family:inherit;font-size:13.5px;padding:9px 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:8px;}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
.tab-count{background:var(--surface-2);color:var(--text);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600;}
.tab-btn.active .tab-count{background:rgba(255,255,255,.25);color:#fff;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0;margin-bottom:16px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-2);font-weight:500;font-size:12px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border-strong);white-space:nowrap;cursor:pointer;user-select:none;}
th .arrow{font-size:10px;color:var(--text-mute);margin-left:3px;}
th.nosort{cursor:default;}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.done-row td{opacity:.55;}
input, select{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);width:100%;}
.btn{font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red);}
.btn-primary:hover{background:var(--red-dark);}
.btn-primary:disabled{background:var(--border-strong);border-color:var(--border-strong);color:var(--text-mute);cursor:not-allowed;}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;white-space:nowrap;}
.b-gray{background:var(--surface-2);color:var(--text-2);}
.b-blue{background:var(--blue-tint);color:var(--blue);}
.b-amber{background:var(--amber-tint);color:var(--amber);}
.b-green{background:var(--green-tint);color:var(--green);}
.b-teal{background:var(--teal-tint);color:var(--teal);}
.b-coral{background:var(--coral-tint);color:var(--coral);}
.b-red{background:var(--red-tint);color:var(--red-dark);}
.jobid-over{color:var(--red-dark);}
.photo-toggle{border:1px dashed var(--border-strong);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text-mute);display:inline-block;}
.photo-toggle.done{border-style:solid;border-color:var(--green);color:var(--green);background:var(--green-tint);}
.empty{padding:36px;text-align:center;color:var(--text-mute);font-size:13px;}
.subhead{font-size:13.5px;font-weight:600;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
.channel-section{margin-bottom:0;border-top:4px solid transparent;}
.channel-section.dc{border-color:var(--blue);} .channel-section.dc .subhead{background:var(--blue-tint);color:var(--blue);}
.channel-section.vd{border-color:var(--teal);} .channel-section.vd .subhead{background:var(--teal-tint);color:var(--teal);}
.channel-section.tpl{border-color:var(--coral);} .channel-section.tpl .subhead{background:var(--coral-tint);color:var(--coral);}

#print-modal, #overdue-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:80;padding:24px;}
.print-preview{max-width:340px;width:100%;background:var(--surface);border-radius:12px;padding:20px 22px;position:relative;}
.print-preview .qrbox{width:80px;height:80px;border:0.5px solid var(--border-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--text-mute);margin:14px auto 0;}
.print-preview table{margin-top:10px;}
.close-btn{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--text-mute);cursor:pointer;}
.modal-box{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto;padding:22px 24px;position:relative;}
</style>
</head>
<body>
<div class="topbar"><div class="brand-mark">SC</div><div class="brand-name">Service Center — GR</div></div>

<main>
  <p class="page-title">ส่วนงาน GR</p>
  <p class="page-sub">รับสินค้าจาก CS → Pack และพิมพ์ใบปะหน้า → ส่งมอบขนส่ง → รับของซ่อมคืน → ส่งมอบ CS</p>

  <button class="overdue-summary" onclick="openOverdueModal()">
    <div class="num" id="overdue-total">0</div>
    <div class="lbl">รายการเกิน SLA ทั้งหมด — กดเพื่อดูรายละเอียดและดำเนินการ</div>
  </button>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="tabs" id="tabs"></div>
  <div id="tab-content"></div>
</main>

<div id="overdue-modal">
  <div class="modal-box">
    <button class="close-btn" onclick="document.getElementById('overdue-modal').style.display='none'">✕</button>
    <h3 style="margin:0 0 12px;font-size:15px">รายการเกิน SLA ทั้งหมด</h3>
    <table>
      <tr><th class="nosort">เลขที่ใบแจ้งซ่อม</th><th class="nosort">ลูกค้า</th><th class="nosort">สินค้า</th><th class="nosort">ขั้นตอนที่ค้าง</th><th class="nosort">เกินมา</th><th class="nosort"></th></tr>
      <tbody id="overdue-rows"></tbody>
    </table>
  </div>
</div>

<div id="print-modal">
  <div class="print-preview">
    <button class="close-btn" onclick="document.getElementById('print-modal').style.display='none'">✕</button>
    <div style="text-align:center;border-bottom:0.5px dashed var(--border-strong);padding-bottom:10px">
      <p style="font-weight:500;font-size:15px;margin:0">ใบปะหน้ากล่อง (ขาไป)</p>
      <p style="font-size:12px;color:var(--text-mute);margin:2px 0 0" id="pp-channel-label"></p>
    </div>
    <table>
      <tr><td style="color:var(--text-2)">เลขที่ใบแจ้งซ่อม</td><td style="text-align:right;font-weight:500" id="pp-id"></td></tr>
      <tr><td style="color:var(--text-2)">สินค้า</td><td style="text-align:right" id="pp-product"></td></tr>
      <tr><td style="color:var(--text-2)">รหัส VD ปลายทาง</td><td style="text-align:right" id="pp-vd"></td></tr>
    </table>
    <div class="qrbox">▦</div>
    <p style="text-align:center;font-size:11px;color:var(--text-mute);margin:8px 0 0">ติดหน้ากล่อง / สแกนยืนยันรับที่ปลายทาง</p>
  </div>
</div>

<script>
const SLA = {receive:24, pack:4, handoff:4, returnReceive:24, deliverCS:4};

let receiveQueue = [
  {id:'JB-2609-08301', customer:'สมชาย ใจดี', product:'สว่านไฟฟ้า Bosch', branch:'บางนา', hoursWaiting:2, photo:false, location:'', done:false},
  {id:'JB-2609-08298', customer:'วิภา รักเรียน', product:'เครื่องปั่น Xiaomi', branch:'บางนา', hoursWaiting:30, photo:false, location:'', done:false},
  {id:'JB-2609-08290', customer:'อรรถพล มั่นคง', product:'สว่านไฟฟ้า Makita', branch:'บางนา', hoursWaiting:1, photo:false, location:'', done:false},
];
let packQueue = [
  {id:'JB-2609-08270', customer:'กนกวรรณ สายทอง', product:'พัดลม Philips', channel:'3PL', oldLocation:'A-04-11', newLocation:'', photo:false, hoursWaiting:6, done:false},
  {id:'JB-2609-08265', customer:'ธีรพงษ์ ศรีสุข', product:'เตารีด Philips', channel:'DC', oldLocation:'A-04-08', newLocation:'', photo:false, hoursWaiting:2, done:false},
];
let handoffQueue = {
  'DC':[{id:'JB-2609-08250', customer:'นภาพร ทองใบ', product:'สว่านไฟฟ้า Bosch', vdCode:'VD-0091', vdName:'ศูนย์ซ่อมไฟฟ้ารุ่งเรือง', photo:false, hoursWaiting:5, done:false}],
  'VD':[{id:'JB-2609-08245', customer:'ปิยะพงษ์ แก้วมณี', product:'เครื่องดูดฝุ่น Xiaomi', vdCode:'VD-0088', vdName:'บ.ช่างเจริญ', photo:false, hoursWaiting:3, done:false}],
  '3PL':[{id:'JB-2609-08240', customer:'สุนิสา บุญมี', product:'สว่านไฟฟ้า Makita', vdCode:'VD-0088', vdName:'บ.ช่างเจริญ', photo:false, hoursWaiting:2, done:false}],
};
let returnReceiveQueue = [
  {id:'JB-2609-08120', customer:'ชัยวัฒน์ เพชรดี', product:'พัดลม Philips', channel:'DC', photo:false, location:'', hoursWaiting:30, done:false},
  {id:'JB-2609-08098', customer:'รัตนา ศรีทอง', product:'เครื่องปั่น Xiaomi', channel:'DSD', photo:false, location:'', hoursWaiting:10, done:false},
];
let returnHandoffQueue = [];

function pending(list){ return list.filter(x=>!x.done).length; }
function overdueCountOf(list, sla){ return list.filter(x=>!x.done && x.hoursWaiting>sla).length; }
function totalHandoffPending(){ return Object.values(handoffQueue).reduce((a,l)=>a+pending(l),0); }
function totalHandoffOverdue(){ return Object.values(handoffQueue).reduce((a,l)=>a+overdueCountOf(l,SLA.handoff),0); }

let activeTab = 'receive';
const tabDefs = [
  {key:'receive', label:'รับจาก CS', count:()=>pending(receiveQueue)},
  {key:'pack', label:'Pack สินค้า', count:()=>pending(packQueue)},
  {key:'handoff', label:'ส่งมอบขนส่ง', count:()=>totalHandoffPending()},
  {key:'return', label:'รับคืนจาก VD/DC/3PL', count:()=>pending(returnReceiveQueue)},
  {key:'deliverCS', label:'รอส่งมอบ CS', count:()=>pending(returnHandoffQueue)},
];
const kpiDefs = [
  {tab:'receive', label:'รอรับจาก CS', count:()=>pending(receiveQueue), over:()=>overdueCountOf(receiveQueue,SLA.receive)},
  {tab:'pack', label:'รอ Pack', count:()=>pending(packQueue), over:()=>overdueCountOf(packQueue,SLA.pack)},
  {tab:'handoff', label:'รอส่งมอบขนส่ง', count:()=>totalHandoffPending(), over:()=>totalHandoffOverdue()},
  {tab:'return', label:'รอรับคืนจาก VD/DC/3PL', count:()=>pending(returnReceiveQueue), over:()=>overdueCountOf(returnReceiveQueue,SLA.returnReceive)},
  {tab:'deliverCS', label:'รอส่งมอบ CS', count:()=>pending(returnHandoffQueue), over:()=>overdueCountOf(returnHandoffQueue,SLA.deliverCS)},
];

function collectOverdue(){
  const out = [];
  receiveQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.receive) out.push({id:j.id, customer:j.customer, product:j.product, stage:'รับจาก CS', tabKey:'receive', over:j.hoursWaiting-SLA.receive}); });
  packQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.pack) out.push({id:j.id, customer:j.customer, product:j.product, stage:'Pack สินค้า', tabKey:'pack', over:j.hoursWaiting-SLA.pack}); });
  Object.entries(handoffQueue).forEach(([ch,list])=>list.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.handoff) out.push({id:j.id, customer:j.customer, product:j.product, stage:'ส่งมอบขนส่ง ('+ch+')', tabKey:'handoff', over:j.hoursWaiting-SLA.handoff}); }));
  returnReceiveQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.returnReceive) out.push({id:j.id, customer:j.customer, product:j.product, stage:'รับคืนจาก VD/DC/3PL', tabKey:'return', over:j.hoursWaiting-SLA.returnReceive}); });
  returnHandoffQueue.forEach(j=>{ if(!j.done && j.hoursWaiting>SLA.deliverCS) out.push({id:j.id, customer:j.customer, product:j.product, stage:'รอส่งมอบ CS', tabKey:'deliverCS', over:j.hoursWaiting-SLA.deliverCS}); });
  out.sort((a,b)=>b.over-a.over);
  return out;
}
function renderOverdueSummary(){
  document.getElementById('overdue-total').textContent = collectOverdue().length;
}
function openOverdueModal(){
  const list = collectOverdue();
  document.getElementById('overdue-rows').innerHTML = list.length ? list.map(o=>`
    <tr><td><b>${o.id}</b></td><td>${o.customer}</td><td>${o.product}</td><td>${o.stage}</td>
    <td><span class="badge b-red">เกิน ${o.over} ชม.</span></td>
    <td><button class="btn btn-primary" onclick="goToJobAction('${o.tabKey}')">ไปดำเนินการ</button></td></tr>`).join('')
    : `<tr><td colspan="6" style="text-align:center;color:var(--text-mute);padding:20px">ไม่มีงานเกิน SLA ในขณะนี้</td></tr>`;
  document.getElementById('overdue-modal').style.display='flex';
}
function goToJobAction(tabKey){
  document.getElementById('overdue-modal').style.display='none';
  setTab(tabKey);
}

function renderKpis(){
  document.getElementById('kpi-grid').innerHTML = kpiDefs.map(k=>`
    <button class="kpi-card" onclick="setTab('${k.tab}')">
      <div class="num">${k.count()}</div>
      <div class="lbl">${k.label}</div>
      ${k.over()>0 ? `<div class="over-lbl">เกิน SLA: ${k.over()} งาน</div>` : ''}
    </button>`).join('');
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = tabDefs.map(t=>`
    <button class="tab-btn ${activeTab===t.key?'active':''}" onclick="setTab('${t.key}')">
      ${t.label} <span class="tab-count">${t.count()}</span>
    </button>`).join('');
}
function setTab(key){ activeTab = key; renderAll(); }
function renderAll(){ renderOverdueSummary(); renderKpis(); renderTabs(); renderContent(); }

function togglePhoto(list, id){
  const item = list.find(x=>x.id===id);
  item.photo = !item.photo;
  renderContent();
}
function refreshBtn(btnId, item){
  const btn = document.getElementById(btnId);
  if(btn) btn.disabled = !(item.photo && (item.location===undefined || item.location) && (item.newLocation===undefined || item.newLocation));
}

// ---- generic sort helper ----
const sortStates = {
  receive:{key:null,dir:1}, pack:{key:null,dir:1},
  handoff_DC:{key:null,dir:1}, handoff_VD:{key:null,dir:1}, handoff_3PL:{key:null,dir:1},
  return:{key:null,dir:1}, deliverCS:{key:null,dir:1}
};
function toggleSort(table, key){
  const st = sortStates[table];
  if(st.key===key) st.dir *= -1; else { st.key=key; st.dir=1; }
  renderContent();
}
function sortedCopy(list, table){
  const st = sortStates[table];
  if(!st.key) return list;
  const copy = [...list];
  copy.sort((a,b)=>{
    let av=a[st.key], bv=b[st.key];
    if(typeof av==='number') return (av-bv)*st.dir;
    return String(av).localeCompare(String(bv),'th')*st.dir;
  });
  return copy;
}
function th(table, key, label){
  const st = sortStates[table];
  const arrow = st.key===key ? (st.dir===1?'▲':'▼') : '';
  return `<th onclick="toggleSort('${table}','${key}')">${label}<span class="arrow">${arrow}</span></th>`;
}

function renderContent(){
  const el = document.getElementById('tab-content');
  if(activeTab==='receive') return el.innerHTML = renderReceive();
  if(activeTab==='pack') return el.innerHTML = renderPack();
  if(activeTab==='handoff') return el.innerHTML = renderHandoff();
  if(activeTab==='return') return el.innerHTML = renderReturn();
  if(activeTab==='deliverCS') return el.innerHTML = renderDeliverCS();
}

function slaTag(hoursWaiting, sla){
  return `${hoursWaiting} ชม.<div style="font-size:11px;color:${hoursWaiting>sla?'var(--red-dark)':'var(--text-mute)'}">SLA ${sla} ชม.${hoursWaiting>sla?' — เกิน':''}</div>`;
}
function jid(j, sla){
  return `<b class="${!j.done && j.hoursWaiting>sla ? 'jobid-over':''}">${j.id}</b>`;
}

// ---- TAB 1: receive from CS ----
function renderReceive(){
  if(!receiveQueue.length) return `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>`;
  const list = sortedCopy(receiveQueue, 'receive');
  return `<div class="card"><table>
    <tr>${th('receive','id','เลขที่ใบแจ้งซ่อม')}${th('receive','customer','ลูกค้า')}${th('receive','product','สินค้า')}${th('receive','branch','สาขา')}${th('receive','hoursWaiting','รอมาแล้ว')}<th class="nosort">ถ่ายภาพ</th><th class="nosort">เลขที่ Location</th><th class="nosort">สถานะ</th></tr>
    ${list.map((j)=>{ const i=receiveQueue.indexOf(j); return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.receive)}</td><td>${j.customer}</td><td>${j.product}</td><td>${j.branch}</td><td>${slaTag(j.hoursWaiting,SLA.receive)}</td>
      <td>${j.done ? '✓' : `<span class="photo-toggle ${j.photo?'done':''}" onclick="togglePhoto(receiveQueue,'${j.id}'); refreshBtn('recv-btn-${j.id}', receiveQueue[${i}])">${j.photo?'✓ ถ่ายแล้ว':'📷 ถ่ายภาพ'}</span>`}</td>
      <td>${j.done ? j.location : `<input value="${j.location}" placeholder="เช่น A-05-02" oninput="receiveQueue[${i}].location=this.value; refreshBtn('recv-btn-${j.id}', receiveQueue[${i}])">`}</td>
      <td>${j.done ? '<span class="badge b-green">รับแล้ว</span>' : `<button class="btn btn-primary" id="recv-btn-${j.id}" ${(!j.photo||!j.location)?'disabled':''} onclick="confirmReceive('${j.id}')">ยืนยันรับสินค้า</button>`}</td>
    </tr>`;}).join('')}
  </table></div>`;
}
function confirmReceive(id){
  const j = receiveQueue.find(x=>x.id===id);
  j.done = true;
  packQueue.push({id:j.id, customer:j.customer, product:j.product, channel:['DC','VD','3PL'][packQueue.length%3], oldLocation:j.location, newLocation:'', photo:false, hoursWaiting:0, done:false});
  renderAll();
}

// ---- TAB 2: pack ----
function renderPack(){
  if(!packQueue.length) return `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>`;
  const list = sortedCopy(packQueue, 'pack');
  return `<div class="card"><table>
    <tr>${th('pack','id','เลขที่ใบแจ้งซ่อม')}${th('pack','customer','ลูกค้า')}${th('pack','product','สินค้า')}${th('pack','channel','ช่องทาง')}${th('pack','hoursWaiting','เวลาที่ค้าง')}<th class="nosort">Location เดิม</th><th class="nosort">Location ใหม่</th><th class="nosort">ถ่ายภาพ</th><th class="nosort">สถานะ</th></tr>
    ${list.map((j)=>{ const i=packQueue.indexOf(j); return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.pack)}</td><td>${j.customer}</td><td>${j.product}</td>
      <td><span class="badge b-blue">${j.channel}</span></td>
      <td>${slaTag(j.hoursWaiting,SLA.pack)}</td>
      <td>${j.oldLocation}</td>
      <td>${j.done ? j.newLocation : `<input value="${j.newLocation}" placeholder="เช่น B-01-04" oninput="packQueue[${i}].newLocation=this.value; refreshBtn('pack-btn-${j.id}', packQueue[${i}])">`}</td>
      <td>${j.done ? '✓' : `<span class="photo-toggle ${j.photo?'done':''}" onclick="togglePhoto(packQueue,'${j.id}'); refreshBtn('pack-btn-${j.id}', packQueue[${i}])">${j.photo?'✓ ถ่ายแล้ว':'📷 ถ่ายภาพ'}</span>`}</td>
      <td>${j.done ? '<span class="badge b-green">Pack แล้ว</span>' : `<button class="btn btn-primary" id="pack-btn-${j.id}" ${(!j.newLocation||!j.photo)?'disabled':''} onclick="confirmPack('${j.id}')">Pack เสร็จ + พิมพ์ใบปะหน้า</button>`}</td>
    </tr>`;}).join('')}
  </table></div>`;
}
function confirmPack(id){
  const j = packQueue.find(x=>x.id===id);
  j.done = true;
  if(j.channel==='3PL'){
    handoffQueue['3PL'].push({id:j.id, customer:j.customer, product:j.product, vdCode:'VD-0088', vdName:'บ.ช่างเจริญ', photo:false, hoursWaiting:0, done:false});
  } else {
    handoffQueue[j.channel].push({id:j.id, customer:j.customer, product:j.product, vdCode:'VD-0091', vdName:'ศูนย์ซ่อมไฟฟ้ารุ่งเรือง', photo:false, hoursWaiting:0, done:false});
    showPrintPreview(j, j.channel);
  }
  renderAll();
}
function showPrintPreview(j, channel){
  document.getElementById('pp-channel-label').textContent = 'ปลายทาง: ' + channel;
  document.getElementById('pp-id').textContent = j.id;
  document.getElementById('pp-product').textContent = j.product;
  document.getElementById('pp-vd').textContent = channel==='DC' ? 'VD-0091' : 'VD-0088';
  document.getElementById('print-modal').style.display = 'flex';
}

// ---- TAB 3: handoff to carrier ----
function renderHandoff(){
  const groups = [
    {key:'DC', cls:'dc', title:'DC (ฝากส่ง)', sortKey:'handoff_DC'},
    {key:'VD', cls:'vd', title:'DSD (VD เข้ารับที่สาขา)', sortKey:'handoff_VD'},
    {key:'3PL', cls:'tpl', title:'3PL (ขนส่งภายนอก)', sortKey:'handoff_3PL'},
  ];
  let html = '<div class="card">';
  groups.forEach(g=>{
    const rawList = handoffQueue[g.key];
    const list = sortedCopy(rawList, g.sortKey);
    const p = pending(rawList);
    html += `<div class="channel-section ${g.cls}">
      <div class="subhead"><span>${g.title}</span><span class="badge ${g.cls==='dc'?'b-blue':g.cls==='vd'?'b-teal':'b-coral'}">${p} งานรอส่งมอบ</span></div>`;
    if(!rawList.length){
      html += `<div class="empty" style="padding:16px">ไม่มีงานในช่องทางนี้</div>`;
    } else {
      html += `<table><tr>${th(g.sortKey,'id','เลขที่ใบแจ้งซ่อม')}${th(g.sortKey,'customer','ลูกค้า')}${th(g.sortKey,'product','สินค้า')}<th class="nosort">ปลายทาง VD</th>${th(g.sortKey,'hoursWaiting','เวลาที่ค้าง')}<th class="nosort">ถ่ายภาพ</th><th class="nosort">สถานะ</th></tr>
      ${list.map((j)=>{ const idx=rawList.indexOf(j); return `<tr class="${j.done?'done-row':''}"><td>${jid(j,SLA.handoff)}</td><td>${j.customer}</td><td>${j.product}</td><td>${j.vdName} (${j.vdCode})</td>
        <td>${slaTag(j.hoursWaiting,SLA.handoff)}</td>
        <td>${j.done ? '✓' : `<span class="photo-toggle ${j.photo?'done':''}" onclick="togglePhoto(handoffQueue['${g.key}'],'${j.id}'); refreshBtn('ho-btn-${j.id}', handoffQueue['${g.key}'][${idx}])">${j.photo?'✓ ถ่ายแล้ว':'📷 ถ่ายภาพ'}</span>`}</td>
        <td>${j.done ? '<span class="badge b-green">ส่งมอบแล้ว</span>' : `<button class="btn btn-primary" id="ho-btn-${j.id}" ${!j.photo?'disabled':''} onclick="confirmHandoff('${g.key}','${j.id}')">สแกนยืนยันส่งมอบ</button>`}</td></tr>`;}).join('')}
      </table>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  return html;
}
function confirmHandoff(channel, id){
  const j = handoffQueue[channel].find(x=>x.id===id);
  j.done = true;
  renderAll();
}

// ---- TAB 4: receive returns ----
function renderReturn(){
  if(!returnReceiveQueue.length) return `<div class="card"><div class="empty">ไม่มีงานในคิวนี้</div></div>`;
  const list = sortedCopy(returnReceiveQueue, 'return');
  return `<div class="card"><table>
    <tr>${th('return','id','เลขที่ใบแจ้งซ่อม')}${th('return','customer','ลูกค้า')}${th('return','product','สินค้า')}${th('return','channel','ช่องทางที่ส่งคืนมา')}${th('return','hoursWaiting','เวลาที่ค้าง')}<th class="nosort">ถ่ายภาพ</th><th class="nosort">เลขที่ Location</th><th class="nosort">สถานะ</th></tr>
    ${list.map((j)=>{ const i=returnReceiveQueue.indexOf(j); return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.returnReceive)}</td><td>${j.customer}</td><td>${j.product}</td>
      <td><span class="badge b-blue">${j.channel}</span></td>
      <td>${slaTag(j.hoursWaiting,SLA.returnReceive)}</td>
      <td>${j.done ? '✓' : `<span class="photo-toggle ${j.photo?'done':''}" onclick="togglePhoto(returnReceiveQueue,'${j.id}'); refreshBtn('ret-btn-${j.id}', returnReceiveQueue[${i}])">${j.photo?'✓ ถ่ายแล้ว':'📷 ถ่ายภาพ'}</span>`}</td>
      <td>${j.done ? j.location : `<input value="${j.location}" placeholder="เช่น C-02-05" oninput="returnReceiveQueue[${i}].location=this.value; refreshBtn('ret-btn-${j.id}', returnReceiveQueue[${i}])">`}</td>
      <td>${j.done ? '<span class="badge b-green">รับคืนแล้ว</span>' : `<button class="btn btn-primary" id="ret-btn-${j.id}" ${(!j.photo||!j.location)?'disabled':''} onclick="confirmReturnReceive('${j.id}')">ยืนยันรับคืน</button>`}</td>
    </tr>`;}).join('')}
  </table></div>`;
}
function confirmReturnReceive(id){
  const j = returnReceiveQueue.find(x=>x.id===id);
  j.done = true;
  returnHandoffQueue.push({id:j.id, customer:j.customer, product:j.product, location:j.location, photo:false, hoursWaiting:0, done:false});
  renderAll();
}

// ---- TAB 5: hand off to CS ----
function renderDeliverCS(){
  if(!returnHandoffQueue.length) return `<div class="card"><div class="empty">ไม่มีงานรอส่งมอบ CS</div></div>`;
  const list = sortedCopy(returnHandoffQueue, 'deliverCS');
  return `<div class="card"><table>
    <tr>${th('deliverCS','id','เลขที่ใบแจ้งซ่อม')}${th('deliverCS','customer','ลูกค้า')}${th('deliverCS','product','สินค้า')}<th class="nosort">Location</th>${th('deliverCS','hoursWaiting','เวลาที่ค้าง')}<th class="nosort">ถ่ายภาพ</th><th class="nosort">สถานะ</th></tr>
    ${list.map((j)=>{ const i=returnHandoffQueue.indexOf(j); return `<tr class="${j.done?'done-row':''}">
      <td>${jid(j,SLA.deliverCS)}</td><td>${j.customer}</td><td>${j.product}</td><td>${j.location}</td>
      <td>${slaTag(j.hoursWaiting,SLA.deliverCS)}</td>
      <td>${j.done ? '✓' : `<span class="photo-toggle ${j.photo?'done':''}" onclick="togglePhoto(returnHandoffQueue,'${j.id}'); refreshBtn('dcs-btn-${j.id}', returnHandoffQueue[${i}])">${j.photo?'✓ ถ่ายแล้ว':'📷 ถ่ายภาพ'}</span>`}</td>
      <td>${j.done ? '<span class="badge b-green">ส่งมอบ CS แล้ว</span>' : `<button class="btn btn-primary" id="dcs-btn-${j.id}" ${!j.photo?'disabled':''} onclick="confirmDeliverCS('${j.id}')">ส่งมอบให้ CS</button>`}</td>
    </tr>`;}).join('')}
  </table></div>`;
}
function confirmDeliverCS(id){
  const j = returnHandoffQueue.find(x=>x.id===id);
  j.done = true;
  renderAll();
}

renderAll();
</script>
</body>
</html>
