<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Thaiwasadu Service Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E; --red-dark:#9C0C22; --red-tint:#FBE7E9;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EEE6;
  --border:#E4DED2; --border-strong:#D2C9B8;
  --text:#2B2723; --text-2:#6B6459; --text-mute:#9A9384;
  --blue:#185FA5; --blue-tint:#E6F1FB;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);}
.app{display:flex;height:100vh;}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:18px 0;flex-shrink:0;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px 14px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.brand-mark{width:34px;height:34px;border-radius:8px;flex-shrink:0;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-name{font-weight:600;font-size:13px;line-height:1.3;}
.role-row{padding:0 16px 12px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.role-row label{font-size:11px;color:var(--text-mute);display:block;margin-bottom:4px;}
select{font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);width:100%;}
nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-2);border:none;background:none;text-align:left;width:100%;font-family:inherit;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--red-tint);color:var(--red-dark);font-weight:600;}
.foot-note{padding:10px 16px;font-size:10.5px;color:var(--text-mute);border-top:1px solid var(--border);}
main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;font-size:13px;color:var(--text-2);display:flex;justify-content:space-between;align-items:center;}
.topbar .path{color:var(--text);font-weight:500;}
iframe{flex:1;border:none;width:100%;background:var(--bg);}
</style>
</head>

<script>
const NAV = [
  {key:'exec', file:'executive_dashboard.html', label:'Executive Dashboard', roles:['Admin']},
  {key:'analytics', file:'dashboard_analytics.html', label:'Dashboard Overview', roles:['Admin']},
  {key:'dashboard', file:'dashboard.html', label:'งานซ่อมทั้งหมด', roles:['Admin','CS','GR','DC','VD']},
  {key:'cs', file:'cs.html', label:'เปิดใบแจ้งซ่อม (CS)', roles:['Admin','CS']},
  {key:'gr', file:'gr.html', label:'GR', roles:['Admin','GR']},
  {key:'dc', file:'dc.html', label:'DC', roles:['Admin','DC']},
  {key:'vd', file:'vd.html', label:'ช่าง (VD)', roles:['Admin','VD']},
  {key:'tradein', file:'tradein.html', label:'Trade-in / คูปอง', roles:['Admin','CS']},
  {key:'s2', file:'s2.html', label:'สต็อกสาขา (S2)', roles:['Admin','CS']},
  {key:'vdpayment', file:'report_vd_payment.html', label:'รายงานจ่ายเงิน VD', roles:['Admin']},
  {key:'admin', file:'admin.html', label:'ตั้งค่าระบบหลังบ้าน', roles:['Admin']},
];
let role = 'Admin';
let active = 'exec';
function setRole(r){
  role = r;
  renderNav();
  const item = NAV.find(n=>n.key===active);
  if(!item || !item.roles.includes(role)) navigate('dashboard');
}
function navigate(key){
  active = key;
  const item = NAV.find(n=>n.key===key);
  document.getElementById('frame').src = item.file;
  document.getElementById('path-label').textContent = item.label;
  renderNav();
}
function renderNav(){
  document.getElementById('nav').innerHTML = NAV.filter(n=>n.roles.includes(role)).map(n=>
    '<button class="nav-item '+(active===n.key?'active':'')+'" onclick="navigate(\''+n.key+'\')">'+n.label+'</button>'
  ).join('');
}
renderNav();
document.getElementById('path-label').textContent = NAV[0].label;
</script>
