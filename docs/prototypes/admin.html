<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Service Center — ตั้งค่าระบบหลังบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E; --red-dark:#9C0C22; --red-tint:#FBE7E9;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EEE6;
  --border:#E4DED2; --border-strong:#D2C9B8;
  --text:#2B2723; --text-2:#6B6459; --text-mute:#9A9384;
  --green:#1D9E75; --green-tint:#E1F5EE;
  --amber:#BA7517; --amber-tint:#FAEEDA;
  --blue:#185FA5; --blue-tint:#E6F1FB;
  --radius:8px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);}
.app{display:flex;min-height:100vh;}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;align-self:flex-start;}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.brand-mark{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
.brand-name{font-weight:600;font-size:15px;}
.brand-sub{font-size:11px;color:var(--text-mute);}
nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;max-height:calc(100vh - 100px);overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;font-size:13.5px;color:var(--text-2);border:none;background:none;text-align:left;width:100%;font-family:inherit;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--red-tint);color:var(--red-dark);font-weight:600;}
.nav-num{width:20px;height:20px;border-radius:5px;background:var(--border);color:var(--text-2);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-item.active .nav-num{background:var(--red);color:#fff;}
main{flex:1;padding:32px 40px;max-width:960px;}
.page-title{font-size:20px;font-weight:600;margin:0 0 4px;}
.page-sub{font-size:13px;color:var(--text-2);margin:0 0 24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px;}
.card h3{font-size:15px;font-weight:600;margin:0 0 4px;}
.card p.hint{font-size:12.5px;color:var(--text-mute);margin:0 0 16px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--text-2);font-weight:500;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--border-strong);}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
input, select{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);width:100%;}
input:focus, select:focus{outline:none;border-color:var(--red);}
.btn{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red);}
.btn-primary:hover{background:var(--red-dark);}
.btn-sm{padding:4px 10px;font-size:12px;}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;}
.row.between{justify-content:space-between;}
.badge{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:500;}
.badge-green{background:var(--green-tint);color:var(--green);}
.badge-amber{background:var(--amber-tint);color:var(--amber);}
.badge-gray{background:var(--surface-2);color:var(--text-2);}
.badge-blue{background:var(--blue-tint);color:var(--blue);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:4px;}
.section{display:none;}
.section.active{display:block;}
.remove-btn{background:none;border:none;color:var(--text-mute);cursor:pointer;font-size:16px;padding:0 6px;}
.remove-btn:hover{color:var(--red);}
.toggle{position:relative;width:36px;height:20px;background:var(--border-strong);border-radius:10px;display:inline-block;cursor:pointer;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .15s;}
.toggle.on::after{left:18px;}
.note{background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--text-2);margin-top:10px;}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:20px;padding:3px 10px 3px 12px;font-size:12px;margin:2px;}
.tag button{background:none;border:none;color:var(--text-mute);cursor:pointer;font-size:13px;}
.multiselect{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--border-strong);border-radius:6px;padding:6px;min-height:36px;}
.sub-block{background:var(--surface-2);border-radius:10px;padding:14px 16px;margin-top:10px;}
.sub-block h4{font-size:13px;font-weight:600;margin:0 0 8px;}
.divider{border-top:1px solid var(--border);margin:16px 0;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">SC</div>
      <div><div class="brand-name">Service Center</div><div class="brand-sub">ตั้งค่าระบบหลังบ้าน</div></div>
    </div>
    <nav id="nav"></nav>
  </div>
  <main>
    <div id="content"></div>
  </main>
</div>

<script>
// ---- master data shared across sections ----
const branchDB = [
  {name:'สาขาบางนา', type:'สาขา', manager:'คุณวิชัย เขตกรุงเทพตะวันออก'},
  {name:'สาขารังสิต', type:'สาขา', manager:'คุณสมหญิง เขตปทุมธานี'},
  {name:'สาขาแจ้งวัฒนะ', type:'สาขา', manager:'คุณวิชัย เขตกรุงเทพตะวันออก'},
  {name:'สาขาพระราม 2', type:'สาขา', manager:'คุณอนุชา เขตกรุงเทพตะวันตก'},
  {name:'สาขาเชียงใหม่', type:'สาขา', manager:'คุณปิยะ เขตภาคเหนือ'},
  {name:'คลัง DC กรุงเทพ', type:'DC', manager:'-'},
  {name:'คลัง DC ชลบุรี', type:'DC', manager:'-'},
];
const brandOptions = ['Bosch','Makita','Xiaomi','Philips','Panasonic'];
const sizeOptions = ['สินค้าขนาดเล็ก','สินค้าขนาดใหญ่'];

const sections = [
  {id:'vendor', name:'Vendor Portal', title:'Vendor Portal', sub:'VD หลัก, ศูนย์บริการย่อย, แบรนด์/ขนาดที่รับผิดชอบ, โซน'},
  {id:'fee', name:'ค่าดำเนินการ / ค่าขนส่ง', title:'ตั้งค่าค่าดำเนินการและค่าขนส่ง 3PL', sub:'กำหนดค่าธรรมเนียมแยกตามประเภทสินค้า'},
  {id:'branch', name:'สาขาไทวัสดุ', title:'Maintain รายชื่อสาขา', sub:'ผูกชื่อสาขากับผู้จัดการเขต (District Manager)'},
  {id:'zone', name:'จับคู่สาขา - VD', title:'จับคู่สาขากับศูนย์บริการ VD', sub:'ใช้กำหนดว่า Book 3PL ให้ไปส่งศูนย์ VD ใด'},
  {id:'sla', name:'SLA', title:'ตั้งค่า SLA การทำงาน', sub:'กำหนดระยะเวลามาตรฐานของแต่ละขั้นตอน ตั้งแต่เปิดงานถึงปิดงาน'},
  {id:'role', name:'สิทธิ์ผู้ใช้งาน', title:'กำหนดสิทธิ์ผู้ใช้งาน (Role)', sub:'Admin, CS, GR, DC, VD, S2'},
  {id:'sku', name:'SKU ค่าซ่อม', title:'ตั้งค่า SKU ค่าซ่อม', sub:'SKU กลางที่ใช้ร่วมกันทุก VD'},
  {id:'payout', name:'รอบจ่ายเงิน Vendor', title:'ตั้งค่ารอบจ่ายเงิน Vendor', sub:'กำหนดรอบบิลและเงื่อนไขหักเงิน'},
  {id:'tradein', name:'Trade-in / คูปอง', title:'ตั้งค่า Trade-in และโปรโมชั่นคูปอง', sub:'กำหนด % ส่วนลด แยกประเภทและช่วงเวลาโปรโมชั่น'},
  {id:'dashboard', name:'Dashboard', title:'ตั้งค่าการแสดงผล Dashboard', sub:'เลือกรายการสรุปที่แสดง และสิทธิ์เห็นข้อมูลต้นทุน'},
];

const nav = document.getElementById('nav');
sections.forEach((s,i)=>{
  const b = document.createElement('button');
  b.className = 'nav-item' + (i===0?' active':'');
  b.dataset.id = s.id;
  b.innerHTML = `<span class="nav-num">${i+1}</span><span>${s.name}</span>`;
  b.onclick = ()=>showSection(s.id);
  nav.appendChild(b);
});
function showSection(id){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id==='sec-'+id));
}
const content = document.getElementById('content');
sections.forEach(s=>{
  const div = document.createElement('div');
  div.className = 'section' + (s.id==='vendor'?' active':'');
  div.id = 'sec-'+s.id;
  div.innerHTML = `<p class="page-title">${s.title}</p><p class="page-sub">${s.sub}</p>` + renderBody(s.id);
  content.appendChild(div);
});

function branchOptionsHTML(selected){
  return branchDB.map(b=>`<option value="${b.name}" ${b.name===selected?'selected':''}>${b.name}${b.type==='DC'?' (DC)':''}</option>`).join('');
}
function multiTags(list){
  return list.map(v=>`<span class="tag">${v}<button onclick="this.parentElement.remove()">✕</button></span>`).join('');
}

function renderBody(id){
  if(id==='vendor') return `
    <div class="card">
      <h3>VD หลัก (ระดับบริษัท)</h3>
      <p class="hint">ข้อมูลสัญญา/เงื่อนไขทางธุรกิจ ใช้ร่วมกันในทุกศูนย์บริการย่อยของ VD นี้</p>
      <div id="vd-parents"></div>
      <div class="row"><button class="btn" onclick="addParentVD()">+ เพิ่ม VD หลัก</button></div>
    </div>`;

  if(id==='fee') return `
    <div class="card">
      <h3>ค่าดำเนินการ (แสดงเป็น "ค่าดำเนินการ" แทนคำว่ามัดจำ)</h3>
      <p class="hint">แยกตามประเภทสินค้า กดเพิ่มประเภทได้</p>
      <table><tr><th>ประเภทสินค้า</th><th>ค่าดำเนินการ (บาท)</th><th></th></tr>
        <tbody id="fee-rows">
          <tr><td>สินค้าขนาดเล็ก</td><td><input value="150"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
          <tr><td>สินค้าขนาดใหญ่</td><td><input value="300"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
        </tbody>
      </table>
      <div class="row between">
        <button class="btn" onclick="addFeeRow('fee-rows')">+ เพิ่มประเภท</button>
        <button class="btn btn-primary" onclick="saveToast(this)">บันทึกค่าดำเนินการ</button>
      </div>
    </div>
    <div class="card">
      <h3>ค่าขนส่ง 3PL</h3>
      <p class="hint">แยกตามประเภทสินค้า ลูกค้าเป็นผู้รับผิดชอบค่าขนส่งนี้เมื่อเลือกส่งด่วน</p>
      <table><tr><th>ประเภทสินค้า</th><th>ค่าขนส่ง (บาท)</th><th></th></tr>
        <tbody id="ship-rows">
          <tr><td>สินค้าขนาดเล็ก</td><td><input value="80"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
          <tr><td>สินค้าขนาดใหญ่</td><td><input value="250"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
        </tbody>
      </table>
      <div class="row between">
        <button class="btn" onclick="addFeeRow('ship-rows')">+ เพิ่มประเภท</button>
        <button class="btn btn-primary" onclick="saveToast(this)">บันทึกค่าขนส่ง</button>
      </div>
    </div>`;

  if(id==='branch') return `
    <div class="card">
      <h3>รายชื่อสาขา / คลัง DC</h3>
      <p class="hint">"District" ในที่นี้คือผู้จัดการเขตที่ดูแลหลายสาขา ไม่ใช่พื้นที่ทางภูมิศาสตร์ — ผูกไว้ที่นี่ แล้วค่อยนำสาขาไปจับคู่กับ VD ในหน้าถัดไป</p>
      <table><tr><th>ชื่อสาขา / คลัง</th><th>ประเภท</th><th>ผู้จัดการเขต (District Manager)</th><th></th></tr>
        <tbody id="branch-rows">
          ${branchDB.map((b,i)=>`<tr><td><input value="${b.name}" onchange="branchDB[${i}].name=this.value"></td><td><select onchange="branchDB[${i}].type=this.value"><option ${b.type==='สาขา'?'selected':''}>สาขา</option><option ${b.type==='DC'?'selected':''}>DC</option></select></td><td><input value="${b.manager}" onchange="branchDB[${i}].manager=this.value" ${b.type==='DC'?'disabled':''}></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>`).join('')}
        </tbody>
      </table>
      <div class="row between">
        <button class="btn" onclick="addBranchRow()">+ เพิ่มสาขา/คลัง</button>
        <button class="btn btn-primary" onclick="saveToast(this)">บันทึกรายชื่อสาขา</button>
      </div>
    </div>`;

  if(id==='zone') return `
    <div class="card">
      <h3>จับคู่สาขา — ศูนย์บริการ VD</h3>
      <p class="hint">สาขาดึงมาจากรายชื่อสาขาไทวัสดุ (หน้าก่อนหน้า) ผู้จัดการเขตแสดงอัตโนมัติ — ใช้ Book 3PL ให้นำสินค้าไปส่งศูนย์ VD ใกล้เคียงที่สุด</p>
      <table><tr><th>สาขา</th><th>ผู้จัดการเขต</th><th>ศูนย์ VD ใกล้เคียงอันดับ 1</th><th>ศูนย์ VD สำรอง</th><th></th></tr>
        <tbody id="zone-rows">
          <tr>
            <td><select onchange="fillManager(this)">${branchOptionsHTML('สาขาบางนา')}</select></td>
            <td><input value="คุณวิชัย เขตกรุงเทพตะวันออก" disabled></td>
            <td><input value="VD-0088-1"></td><td><input value="VD-0091-1"></td>
            <td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td>
          </tr>
        </tbody>
      </table>
      <div class="row between">
        <button class="btn" onclick="addZoneRow()">+ เพิ่มการจับคู่</button>
        <button class="btn btn-primary" onclick="saveToast(this)">บันทึกการจับคู่</button>
      </div>
    </div>`;

  if(id==='sla') return `
    <div class="card">
      <h3>SLA แต่ละขั้นตอน (ตามลำดับ flow เต็ม)</h3>
      <table><tr><th>#</th><th>ขั้นตอน</th><th>SLA</th><th></th></tr>
        <tbody id="sla-rows">
          ${['CS เปิดใบแจ้งซ่อม → ส่งมอบ GR','GR Pack สินค้าลงกล่อง','GR ส่งมอบให้ DC/VD/3PL','DC/VD/3PL เข้ารับสินค้าที่สาขา','VD เข้ารับสินค้าที่ DC','VD ระยะเวลาซ่อม (ไม่รวมรออะไหล่)','VD ส่งคืนกลับ 3PL/DC/สาขา','ลูกค้าเข้ารับสินค้า','ปิดงาน']
            .map((step,i)=>`<tr><td>${i+1}</td><td>${step}</td><td><input placeholder="เช่น 24 ชม. / 2 วัน" value="${['24 ชม.','4 ชม.','4 ชม.','24 ชม.','24 ชม.','7 วัน','24 ชม.','7 วัน','1 วัน'][i]}"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>`).join('')}
        </tbody>
      </table>
      <div class="row between">
        <button class="btn" onclick="addSlaRow()">+ เพิ่มขั้นตอน</button>
        <button class="btn btn-primary" onclick="saveToast(this)">บันทึก SLA</button>
      </div>
    </div>`;

  if(id==='role') return `
    <div class="card">
      <h3>สิทธิ์การเข้าถึงเมนู</h3>
      <table>
        <tr><th>เมนู</th><th>Admin</th><th>CS</th><th>GR</th><th>DC</th><th>VD</th><th>S2</th></tr>
        ${['Dashboard','เปิดใบแจ้งซ่อม','รับ-ส่งสินค้า (GR)','จัดการงาน DC','เสนอราคา (VD)','ตั้งค่าระบบหลังบ้าน','เปิดงานสต็อกสาขา (S2)','Trade-in/คูปอง']
          .map(m=>`<tr><td>${m}</td>${['Admin','CS','GR','DC','VD','S2'].map(r=>`<td style="text-align:center"><div class="toggle ${Math.random()>0.4?'on':''}" onclick="this.classList.toggle('on')"></div></td>`).join('')}</tr>`).join('')}
      </table>
      <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" onclick="saveToast(this)">บันทึกสิทธิ์</button></div>
    </div>`;

  if(id==='sku') return `
    <div class="card">
      <h3>SKU กลางสำหรับค่าซ่อม</h3>
      <p class="hint">ใช้ SKU เดียวกันทุก VD เพื่อให้บันทึกบัญชี/ออกใบเสร็จเป็นมาตรฐานเดียวกัน</p>
      <table><tr><th>SKU</th><th>รายละเอียด</th><th></th></tr>
        <tbody id="sku-rows">
          <tr><td>SVC-REPAIR-001</td><td>ค่าซ่อมสินค้า (รวม VAT)</td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
          <tr><td>SVC-OPENFEE-001</td><td>ค่าเปิดเครื่องตรวจเช็ค</td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
        </tbody>
      </table>
      <div class="row between">
        <button class="btn" onclick="addSkuRow()">+ เพิ่ม SKU</button>
        <button class="btn btn-primary" onclick="saveToast(this)">บันทึก SKU</button>
      </div>
    </div>`;

  if(id==='payout') return `
    <div class="card">
      <h3>รอบจ่ายเงิน Vendor</h3>
      <div class="grid2">
        <div class="field"><label>รูปแบบรอบจ่าย</label><select><option>ทุกวันที่กำหนดของเดือน</option><option>ทุก 15 วัน</option><option>ทุกสัปดาห์</option></select></div>
        <div class="field"><label>วันที่เริ่มรอบถัดไป</label><input type="date"></div>
      </div>
      <div class="note">ยอดจ่ายคำนวณจากรายงานงานที่ VD ปิดงานสำเร็จ หัก GP% ตามที่ตั้งไว้ในหน้า Vendor Portal และหักเพิ่มกรณี VD ทำผิดพลาด</div>
      <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" onclick="saveToast(this)">บันทึกรอบจ่าย</button></div>
    </div>`;

  if(id==='tradein') return `
    <div class="card">
      <h3>โปรโมชั่น Trade-in / คูปอง</h3>
      <p class="hint">แยกตามประเภท Trade-in, ประเภทสินค้า และ sub_dept พร้อมช่วงวันที่โปรโมชั่นแบบปฏิทิน</p>
      <table>
        <tr><th>ชื่อโปร</th><th>ประเภท Trade-in</th><th>ประเภทสินค้า</th><th>ส่วนลด %</th><th>เริ่ม</th><th>สิ้นสุด</th><th>สถานะ</th><th></th></tr>
        <tbody id="promo-rows">
          <tr><td>โปรทั่วไป</td><td>1 (หน้างาน)</td><td>เล็ก</td><td><input value="10" style="width:55px"></td><td><input type="date" value="2026-09-01"></td><td><input type="date" value="2026-12-31"></td><td><span class="badge badge-green">Active</span></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
          <tr><td>โปรปีใหม่</td><td>2 (หลังบ้าน)</td><td>ใหญ่</td><td><input value="15" style="width:55px"></td><td><input type="date" value="2026-12-15"></td><td><input type="date" value="2027-01-15"></td><td><span class="badge badge-green">Active</span></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>
        </tbody>
      </table>
      <div class="row between">
        <button class="btn" onclick="addPromoRow()">+ เพิ่มโปรโมชั่น</button>
        <button class="btn btn-primary" onclick="saveToast(this)">บันทึกโปรโมชั่น</button>
      </div>
      <div class="note">หากมีโปรที่ Active ซ้อนช่วงเวลาและตรงเงื่อนไขเดียวกัน ระบบเลือก % ส่วนลดสูงสุดให้อัตโนมัติ หาก % เท่ากัน ใช้โปรที่สร้างล่าสุด</div>
    </div>`;

  if(id==='dashboard') return `
    <div class="card">
      <h3>รายการสรุปที่แสดงบน Dashboard</h3>
      <p class="hint">เลือกเปิด/ปิดรายการย่อยแต่ละตัว เพื่อ custom หน้า Dashboard</p>
      <table id="dash-table"><tr><th>รายการ</th><th>แสดงผล</th><th></th></tr>
        <tbody id="dash-rows">
        ${['จำนวนงานเปิดอยู่','งานเกิน SLA','อัตราลูกค้าอนุมัติซ่อม','รอบเวลาเฉลี่ยต่องาน','รายได้เดือนนี้','ยอดค้างจ่าย Vendor','กราฟเทียบวัน/เดือน/ปี']
          .map(m=>`<tr><td>${m}</td><td><div class="toggle on" onclick="this.classList.toggle('on')"></div></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td></tr>`).join('')}
        </tbody>
      </table>
      <div class="row" style="margin-top:14px">
        <div class="field" style="flex:1">
          <label>เพิ่มรายงานอื่นๆ เข้า Dashboard</label>
          <select onchange="addDashReport(this)">
            <option value="">— เลือกรายงานที่ต้องการเพิ่ม —</option>
            <option>ปริมาณงานตามสาขา</option>
            <option>สัดส่วนลูกค้าอนุมัติ/ไม่ซ่อม</option>
            <option>Vendor Scorecard สรุป</option>
            <option>DC Scorecard สรุป</option>
            <option>ยอดขาย Trade-in / คูปอง</option>
            <option>งานตามช่องทางจัดส่ง (DSD/DC/3PL)</option>
            <option>กำไรขาดทุนต่องาน</option>
          </select>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>สิทธิ์เห็นข้อมูลต้นทุน/กำไรขาดทุน</h3>
      <p class="hint">ข้อมูลต้นทุนและกำไรเป็นข้อมูลอ่อนไหว เปิดให้เห็นเฉพาะบาง role</p>
      <table><tr><th>Role</th><th>เห็นต้นทุน/กำไรขาดทุน</th></tr>
      ${['Admin','CS','GR','DC','VD','S2'].map(r=>`<tr><td>${r}</td><td><div class="toggle ${r==='Admin'?'on':''}" onclick="this.classList.toggle('on')"></div></td></tr>`).join('')}
      </table>
    </div>
    <div class="card">
      <div class="row between">
        <div>
          <h3 style="margin-bottom:2px">Export รายงาน</h3>
          <p class="hint" style="margin-bottom:0">ส่งออกข้อมูล Dashboard เป็นไฟล์ Excel ตามช่วงวันที่ที่เลือก</p>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <div class="field" style="flex:1"><label>ตั้งแต่วันที่</label><input type="date"></div>
        <div class="field" style="flex:1"><label>ถึงวันที่</label><input type="date"></div>
        <button class="btn btn-primary" style="align-self:flex-end" onclick="saveToast(this,'กำลังสร้างไฟล์ Excel…')">Export เป็น Excel</button>
      </div>
    </div>`;
  return '';
}

// ---- Vendor Portal (parent + sub-centers + brand/size) ----
let vdParents = [
  {code:'VD-0088', name:'บ.ช่างเจริญ', gp:'18', sla:'7', brands:['Bosch','Makita'], sizes:['สินค้าขนาดใหญ่'],
   subs:[{code:'VD-0088-1', zone:'สาขาบางนา', address:'ถ.บางนา-ตราด', phone:'02-xxx-xxxx', method:'DC + DSD', gp:'', sla:''}]},
  {code:'VD-0091', name:'ศูนย์ซ่อมไฟฟ้ารุ่งเรือง', gp:'15', sla:'5', brands:['Xiaomi','Philips'], sizes:['สินค้าขนาดเล็ก'],
   subs:[{code:'VD-0091-1', zone:'สาขารังสิต', address:'ถ.พหลโยธิน', phone:'02-yyy-yyyy', method:'DSD', gp:'', sla:''}]},
];
function renderVendorParents(){
  const el = document.getElementById('vd-parents');
  el.innerHTML = vdParents.map((p,pi)=>`
    <div class="sub-block">
      <div class="grid3">
        <div class="field"><label>รหัส VD หลัก</label><input value="${p.code}" onchange="vdParents[${pi}].code=this.value"></div>
        <div class="field"><label>ชื่อบริษัท</label><input value="${p.name}" onchange="vdParents[${pi}].name=this.value"></div>
        <div class="field"><label>GP% เริ่มต้น</label><input value="${p.gp}" onchange="vdParents[${pi}].gp=this.value"></div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label>แบรนด์ที่รับผิดชอบ (เลือกได้หลายรายการ)</label>
          <div class="multiselect">${multiTags(p.brands)}</div>
          <select style="margin-top:6px" onchange="if(this.value){vdParents[${pi}].brands.push(this.value);renderVendorParents();}this.value=''"><option value="">+ เพิ่มแบรนด์</option>${brandOptions.map(b=>`<option>${b}</option>`).join('')}</select>
        </div>
        <div class="field"><label>ขนาดสินค้าที่รับผิดชอบ (เลือกได้หลายรายการ)</label>
          <div class="multiselect">${multiTags(p.sizes)}</div>
          <select style="margin-top:6px" onchange="if(this.value){vdParents[${pi}].sizes.push(this.value);renderVendorParents();}this.value=''"><option value="">+ เพิ่มขนาด</option>${sizeOptions.map(s=>`<option>${s}</option>`).join('')}</select>
        </div>
      </div>
      <div class="divider"></div>
      <h4>ศูนย์บริการย่อยของ ${p.name}</h4>
      <table><tr><th>รหัสศูนย์ย่อย</th><th>โซน (สาขา/คลัง)</th><th>วิธีรับ-ส่ง</th><th>GP% override</th><th>SLA override</th><th></th></tr>
        ${p.subs.map((s,si)=>`<tr>
          <td><input value="${s.code}" onchange="vdParents[${pi}].subs[${si}].code=this.value"></td>
          <td><select onchange="vdParents[${pi}].subs[${si}].zone=this.value">${branchOptionsHTML(s.zone)}</select></td>
          <td><select onchange="vdParents[${pi}].subs[${si}].method=this.value"><option ${s.method==='DSD'?'selected':''}>DSD</option><option ${s.method==='DC'?'selected':''}>DC</option><option ${s.method==='DC + DSD'?'selected':''}>DC + DSD</option></select></td>
          <td><input placeholder="ค่าเริ่มต้น: ${p.gp}%" value="${s.gp}" onchange="vdParents[${pi}].subs[${si}].gp=this.value"></td>
          <td><input placeholder="ค่าเริ่มต้น: ${p.sla} วัน" value="${s.sla}" onchange="vdParents[${pi}].subs[${si}].sla=this.value"></td>
          <td><button class="remove-btn" onclick="vdParents[${pi}].subs.splice(${si},1);renderVendorParents()">✕</button></td>
        </tr>`).join('')}
      </table>
      <div class="row between">
        <button class="btn btn-sm" onclick="vdParents[${pi}].subs.push({code:'',zone:'${branchDB[0].name}',address:'',phone:'',method:'DSD',gp:'',sla:''});renderVendorParents()">+ เพิ่มศูนย์ย่อย</button>
        <button class="remove-btn" onclick="vdParents.splice(${pi},1);renderVendorParents()">ลบ VD หลักนี้ ✕</button>
      </div>
    </div>`).join('') + `<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-primary" onclick="saveToast(this)">บันทึก Vendor Portal</button></div>`;
}
function addParentVD(){
  vdParents.push({code:'', name:'', gp:'', sla:'', brands:[], sizes:[], subs:[]});
  renderVendorParents();
}

function fillManager(sel){
  const tr = sel.closest('tr');
  const b = branchDB.find(x=>x.name===sel.value);
  tr.querySelector('td:nth-child(2) input').value = b ? b.manager : '';
}
function saveToast(btn, msg){
  const old = btn.textContent;
  btn.textContent = msg || 'บันทึกแล้ว ✓';
  setTimeout(()=>btn.textContent = old, 1400);
}
function addFeeRow(target){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input placeholder="ชื่อประเภทสินค้าใหม่"></td><td><input placeholder="บาท"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById(target).appendChild(tr);
}
function addBranchRow(){
  branchDB.push({name:'', type:'สาขา', manager:''});
  showSection('branch');
  document.getElementById('sec-branch').innerHTML = `<p class="page-title">Maintain รายชื่อสาขา</p><p class="page-sub">ผูกชื่อสาขากับผู้จัดการเขต (District Manager)</p>` + renderBody('branch');
}
function addZoneRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><select onchange="fillManager(this)">${branchOptionsHTML()}</select></td><td><input disabled></td><td><input placeholder="รหัสศูนย์ย่อย VD"></td><td><input placeholder="รหัสศูนย์ย่อยสำรอง"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById('zone-rows').appendChild(tr);
}
function addSlaRow(){
  const tr = document.createElement('tr');
  const n = document.getElementById('sla-rows').children.length+1;
  tr.innerHTML = `<td>${n}</td><td><input placeholder="ชื่อขั้นตอนใหม่"></td><td><input placeholder="เช่น 2 วัน"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById('sla-rows').appendChild(tr);
}
function addSkuRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input placeholder="SKU-xxxx"></td><td><input placeholder="รายละเอียด"></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById('sku-rows').appendChild(tr);
}
function addPromoRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input placeholder="ชื่อโปร"></td><td><select><option>1 (หน้างาน)</option><option>2 (หลังบ้าน)</option></select></td><td><input placeholder="เล็ก/ใหญ่"></td><td><input style="width:55px" placeholder="%"></td><td><input type="date"></td><td><input type="date"></td><td><span class="badge badge-amber">ร่าง</span></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById('promo-rows').appendChild(tr);
}
function addDashReport(sel){
  if(!sel.value) return;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${sel.value}</td><td><div class="toggle on" onclick="this.classList.toggle('on')"></div></td><td><button class="remove-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById('dash-rows').appendChild(tr);
  sel.value = '';
}
renderVendorParents();
</script>
</body>
</html>
