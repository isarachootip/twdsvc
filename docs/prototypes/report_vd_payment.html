<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>รายงานจ่ายเงิน VD — Thaiwasadu Service Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --red:#C8102E; --red-dark:#9C0C22; --red-tint:#FBE7E9;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EEE6;
  --border:#E4DED2; --border-strong:#D2C9B8;
  --text:#2B2723; --text-2:#6B6459; --text-mute:#9A9384;
  --green:#1D9E75; --green-tint:#E1F5EE;
  --amber:#BA7517; --amber-tint:#FAEEDA;
  --blue:#185FA5; --blue-tint:#E6F1FB;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;position:sticky;top:0;z-index:50;}
.page-title{font-size:20px;font-weight:600;margin:0 0 2px;}
.page-sub{font-size:12.5px;color:var(--text-2);margin:0;}
main{max-width:1200px;margin:0 auto;padding:22px 24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:16px;}
.card h3{font-size:14px;font-weight:600;margin:0 0 4px;}
.card p.hint{font-size:12px;color:var(--text-mute);margin:0 0 14px;}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:4px;}
select,input{font-family:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);}
.btn{font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red);}
.btn-primary:hover{background:var(--red-dark);}
.btn-primary:disabled{background:var(--border-strong);border-color:var(--border-strong);color:var(--text-mute);cursor:not-allowed;}
.view-tabs{display:flex;gap:6px;margin:14px 0;}
.tab-btn{font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);cursor:pointer;}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.kpi-card .num{font-size:22px;font-weight:600;}
.kpi-card .lbl{font-size:11.5px;color:var(--text-2);margin-top:3px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--text-2);font-weight:500;font-size:11px;padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--border-strong);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.badge{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap;}
.b-gray{background:var(--surface-2);color:var(--text-2);}
.b-green{background:var(--green-tint);color:var(--green);}
.b-amber{background:var(--amber-tint);color:var(--amber);}
.link-sm{font-size:12px;color:var(--blue);cursor:pointer;font-weight:500;background:none;border:none;padding:0;}
.footer-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 14px 14px;}
.empty{padding:26px;text-align:center;color:var(--text-mute);font-size:12.5px;}
#detail-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:80;padding:20px;}
.modal-box{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto;padding:22px 24px;position:relative;}
.close-btn{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--text-mute);cursor:pointer;}
input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
</style>
</head>
<body>
<div class="topbar">
  <p class="page-title">รายงานจ่ายเงิน VD</p>
  <p class="page-sub">สรุปยอดที่ต้องจ่าย VD ตามรอบการจ่าย พร้อมรายละเอียดใบงานที่เกี่ยวข้อง</p>
</div>

<main>
  <div class="card">
    <div class="filter-bar">
      <div class="field"><label style="font-size:11px;color:var(--text-2);display:block;margin-bottom:4px">รอบจ่าย</label>
        <select id="f-cycle" onchange="renderAll()">
          <option value="2026-09-05">รอบ 5 ก.ย. 2569</option>
          <option value="2026-09-20" selected>รอบ 20 ก.ย. 2569</option>
        </select>
      </div>
      <div class="field"><label style="font-size:11px;color:var(--text-2);display:block;margin-bottom:4px">ตั้งแต่วันที่</label><input type="date" id="f-start" value="2026-09-01" onchange="renderAll()"></div>
      <div class="field"><label style="font-size:11px;color:var(--text-2);display:block;margin-bottom:4px">ถึงวันที่</label><input type="date" id="f-end" value="2026-09-20" onchange="renderAll()"></div>
      <div class="field" style="flex:1;min-width:220px"><label style="font-size:11px;color:var(--text-2);display:block;margin-bottom:4px">ค้นหา</label>
        <input id="f-search" placeholder="รหัส VD / ชื่อ VD / Brand / เลขใบแจ้งซ่อม / เบอร์โทร / ชื่อลูกค้า" oninput="renderAll()"></div>
      <div class="field"><button class="btn" onclick="exportExcel()">Export เป็น Excel</button></div>
    </div>
    <div class="view-tabs" style="justify-content:space-between;display:flex">
      <div style="display:flex;gap:6px">
        <button class="tab-btn active" data-v="vd" onclick="setView('vd')">By VD</button>
        <button class="tab-btn" data-v="store" onclick="setView('store')">By สาขา</button>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);cursor:pointer">
        <input type="checkbox" id="show-gp" onchange="renderAll()"> แสดงคอลัมน์ % GP และมูลค่า GP (บาท)
      </label>
    </div>
  </div>

  <div class="kpi-row" id="kpi-row"></div>

  <div class="card">
    <h3 id="table-title">สรุปยอดจ่ายแยกตาม VD</h3>
    <p class="hint">ติ๊กเลือกรายการที่ต้องการส่งไปทำจ่าย หรือกด "เลือกทั้งหมด"</p>
    <table>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">ไม่พบรายการในช่วงที่เลือก</div>
  </div>
</main>

<div class="footer-bar" style="max-width:1200px;margin:0 auto">
  <span id="selected-summary" style="font-size:13px;color:var(--text-2)"></span>
  <button class="btn btn-primary" id="send-btn" onclick="sendForPayment()" disabled>ส่งไปทำจ่าย</button>
</div>

<div id="detail-modal">
  <div class="modal-box">
    <button class="close-btn" onclick="document.getElementById('detail-modal').style.display='none'">✕</button>
    <h3 style="margin:0 0 4px;font-size:15px" id="detail-title"></h3>
    <p style="font-size:12px;color:var(--text-mute);margin:0 0 14px" id="detail-sub"></p>
    <table><tr><th>เลขที่ใบงาน</th><th>ลูกค้า</th><th>สินค้า</th><th>วันที่ปิดงาน</th><th>ยอดค่าซ่อม</th><th>หัก GP%</th><th>ยอดสุทธิ</th></tr>
      <tbody id="detail-rows"></tbody>
    </table>
  </div>
</div>

<script>
/* ---- mock job-level data feeding the payment summary ---- */
const jobsData = [
  {id:'JB-2609-08085', vd:'VD-0088', vdName:'บ.ช่างเจริญ', store:'บางนา', customer:'อนุชา วงศ์ษา', phone:'082-567-1234', product:'สว่านไฟฟ้า Bosch', brand:'Bosch', closedDate:'2026-09-02', amount:1200, gp:18},
  {id:'JB-2609-08070', vd:'VD-0088', vdName:'บ.ช่างเจริญ', store:'บางนา', customer:'มณีรัตน์ ใจงาม', phone:'083-671-2345', product:'เตารีด Philips', brand:'Philips', closedDate:'2026-09-05', amount:980, gp:18},
  {id:'JB-2609-08040', vd:'VD-0088', vdName:'บ.ช่างเจริญ', store:'แจ้งวัฒนะ', customer:'กิตติศักดิ์ รุ่งเรือง', phone:'086-234-5671', product:'พัดลม Philips', brand:'Philips', closedDate:'2026-09-08', amount:750, gp:18},
  {id:'JB-2609-08098', vd:'VD-0091', vdName:'ศูนย์ซ่อมไฟฟ้ารุ่งเรือง', store:'แจ้งวัฒนะ', customer:'รัตนา ศรีทอง', phone:'081-456-7123', product:'เครื่องปั่น Xiaomi', brand:'Xiaomi', closedDate:'2026-09-05', amount:650, gp:15},
  {id:'JB-2609-08122', vd:'VD-0091', vdName:'ศูนย์ซ่อมไฟฟ้ารุ่งเรือง', store:'รังสิต', customer:'สุนิสา บุญมี', phone:'088-234-5671', product:'สว่านไฟฟ้า Makita', brand:'Makita', closedDate:'2026-09-11', amount:1450, gp:15},
  {id:'JB-2609-08050', vd:'VD-0102', vdName:'ช่างเทค เซอร์วิส', store:'รังสิต', customer:'วราภรณ์ พงษ์ไทย', phone:'085-123-4567', product:'เครื่องดูดฝุ่น Xiaomi', brand:'Xiaomi', closedDate:'2026-09-09', amount:890, gp:20},
  {id:'JB-2609-08110', vd:'VD-0075', vdName:'บ.อีเลคโทรฟิกซ์', store:'บางนา', customer:'ชัยวัฒน์ เพชรดี', phone:'089-345-6712', product:'พัดลม Philips', brand:'Philips', closedDate:'2026-09-04', amount:700, gp:16},
  {id:'JB-2609-08155', vd:'VD-0075', vdName:'บ.อีเลคโทรฟิกซ์', store:'เชียงใหม่', customer:'นภาพร ทองใบ', phone:'086-712-3456', product:'สว่านไฟฟ้า Bosch', brand:'Bosch', closedDate:'2026-09-07', amount:1320, gp:16},
];
let paid = {}; // job id -> paid status
let view = 'vd';
let selected = new Set();

function fmtBaht(n){ return '฿'+Math.round(n).toLocaleString(); }
function netAmount(j){ return j.amount * (1 - j.gp/100); }

function inRange(j){
  const s = document.getElementById('f-start').value;
  const e = document.getElementById('f-end').value;
  return (!s || j.closedDate>=s) && (!e || j.closedDate<=e);
}
function matchesSearch(j){
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  if(!q) return true;
  return [j.vd, j.vdName, j.brand, j.id, j.phone, j.customer].some(v => (v||'').toLowerCase().includes(q));
}

function groupData(){
  const filtered = jobsData.filter(j => inRange(j) && matchesSearch(j));
  const key = view==='vd' ? j=>j.vd+'|'+j.vdName : j=>j.store;
  const groups = {};
  filtered.forEach(j=>{
    const k = key(j);
    if(!groups[k]) groups[k] = {key:k, jobs:[], total:0, net:0};
    groups[k].jobs.push(j);
    groups[k].total += j.amount;
    groups[k].net += netAmount(j);
  });
  return Object.values(groups);
}

function setView(v){
  view = v;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  document.getElementById('table-title').textContent = v==='vd' ? 'สรุปยอดจ่ายแยกตาม VD' : 'สรุปยอดจ่ายแยกตามสาขา';
  selected.clear();
  renderAll();
}

function renderKpis(){
  const groups = groupData();
  const totalNet = groups.reduce((a,g)=>a+g.net,0);
  const totalJobs = groups.reduce((a,g)=>a+g.jobs.length,0);
  const paidCount = jobsData.filter(j=>paid[j.id]).length;
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card"><div class="num">${groups.length}</div><div class="lbl">${view==='vd'?'จำนวน VD':'จำนวนสาขา'}ในรอบนี้</div></div>
    <div class="kpi-card"><div class="num">${totalJobs}</div><div class="lbl">จำนวนใบงานทั้งหมด</div></div>
    <div class="kpi-card"><div class="num">${fmtBaht(totalNet)}</div><div class="lbl">ยอดสุทธิที่ต้องจ่ายรวม</div></div>
    <div class="kpi-card"><div class="num">${paidCount}/${jobsData.length}</div><div class="lbl">ใบงานที่ส่งจ่ายแล้ว</div></div>
  `;
}

function renderTable(){
  const groups = groupData();
  document.getElementById('empty-msg').style.display = groups.length ? 'none' : 'block';
  const headLabel = view==='vd' ? 'VD' : 'สาขา';
  const showGp = document.getElementById('show-gp').checked;
  document.getElementById('thead-row').innerHTML = `
    <th class="nosort" style="width:36px"><input type="checkbox" id="select-all" onchange="toggleAll(this.checked)"></th>
    <th class="nosort">${headLabel}</th><th class="nosort">จำนวนใบงาน</th><th class="nosort">ยอดค่าซ่อมรวม</th>
    ${showGp ? '<th class="nosort">% GP เฉลี่ย</th><th class="nosort">มูลค่า GP (บาท)</th>' : ''}
    <th class="nosort">ยอดสุทธิหัก GP</th><th class="nosort">สถานะ</th><th class="nosort"></th>`;
  document.getElementById('rows').innerHTML = groups.map(g=>{
    const allPaid = g.jobs.every(j=>paid[j.id]);
    const label = view==='vd' ? g.jobs[0].vd+' '+g.jobs[0].vdName : g.key;
    const gpValue = g.total - g.net;
    const gpPercent = g.total ? (gpValue/g.total*100) : 0;
    return `<tr>
      <td><input type="checkbox" ${selected.has(g.key)?'checked':''} ${allPaid?'disabled':''} onchange="toggleRow('${g.key}', this.checked)"></td>
      <td><b>${label}</b></td>
      <td>${g.jobs.length}</td>
      <td>${fmtBaht(g.total)}</td>
      ${showGp ? `<td>${gpPercent.toFixed(1)}%</td><td>${fmtBaht(gpValue)}</td>` : ''}
      <td><b>${fmtBaht(g.net)}</b></td>
      <td>${allPaid?'<span class="badge b-green">จ่ายแล้ว</span>':'<span class="badge b-amber">รอจ่าย</span>'}</td>
      <td><button class="link-sm" onclick="openDetail('${g.key}')">ดูรายละเอียด ↗</button></td>
    </tr>`;
  }).join('');
  updateFooter();
}

function toggleRow(key, checked){
  if(checked) selected.add(key); else selected.delete(key);
  updateFooter();
  const allCb = document.getElementById('select-all');
  const groups = groupData();
  allCb.checked = groups.length>0 && groups.every(g=>selected.has(g.key) || g.jobs.every(j=>paid[j.id]));
}
function toggleAll(checked){
  const groups = groupData();
  groups.forEach(g=>{
    const allPaid = g.jobs.every(j=>paid[j.id]);
    if(!allPaid){ if(checked) selected.add(g.key); else selected.delete(g.key); }
  });
  renderTable();
}
function updateFooter(){
  const groups = groupData();
  const chosen = groups.filter(g=>selected.has(g.key));
  const totalNet = chosen.reduce((a,g)=>a+g.net,0);
  document.getElementById('selected-summary').textContent = chosen.length
    ? `เลือกแล้ว ${chosen.length} รายการ — รวม ${fmtBaht(totalNet)}`
    : 'ยังไม่ได้เลือกรายการ';
  document.getElementById('send-btn').disabled = chosen.length===0;
}
function sendForPayment(){
  const groups = groupData();
  const chosen = groups.filter(g=>selected.has(g.key));
  if(!chosen.length) return;
  chosen.forEach(g=> g.jobs.forEach(j=> paid[j.id]=true ));
  const totalNet = chosen.reduce((a,g)=>a+g.net,0);
  alert(`ส่งไปทำจ่ายสำเร็จ — ${chosen.length} รายการ รวม ${fmtBaht(totalNet)}\n(จำลองการส่งเข้าสู่ระบบบัญชี/จ่ายเงิน)`);
  selected.clear();
  renderAll();
}

function openDetail(key){
  const groups = groupData();
  const g = groups.find(x=>x.key===key);
  const label = view==='vd' ? g.jobs[0].vd+' — '+g.jobs[0].vdName : g.key;
  document.getElementById('detail-title').textContent = label;
  document.getElementById('detail-sub').textContent = `${g.jobs.length} ใบงาน · รวมยอดสุทธิ ${fmtBaht(g.net)}`;
  document.getElementById('detail-rows').innerHTML = g.jobs.map(j=>`
    <tr><td><b>${j.id}</b></td><td>${j.customer}</td><td>${j.product}</td><td>${j.closedDate}</td>
    <td>${fmtBaht(j.amount)}</td><td>${j.gp}%</td><td><b>${fmtBaht(netAmount(j))}</b></td></tr>`).join('');
  document.getElementById('detail-modal').style.display='flex';
}

function exportExcel(){
  const groups = groupData();
  const rows = [];
  groups.forEach(g=>{
    g.jobs.forEach(j=>{
      rows.push({
        [view==='vd'?'VD':'สาขา']: view==='vd' ? j.vd+' '+j.vdName : j.store,
        'เลขที่ใบงาน': j.id, 'ลูกค้า': j.customer, 'สินค้า': j.product,
        'วันที่ปิดงาน': j.closedDate, 'ยอดค่าซ่อม': j.amount, 'หัก GP%': j.gp,
        'ยอดสุทธิ': Math.round(netAmount(j)), 'สถานะ': paid[j.id] ? 'จ่ายแล้ว':'รอจ่าย'
      });
    });
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'รายงานจ่าย VD');
  XLSX.writeFile(wb, 'vd_payment_report.xlsx');
}

function renderAll(){ renderKpis(); renderTable(); }
renderAll();
</script>
</body>
</html>
