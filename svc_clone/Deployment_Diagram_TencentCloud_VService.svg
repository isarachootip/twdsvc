<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1150" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#C2571A"/>
    </marker>
  </defs>
  <rect width="1560" height="1150" fill="#FFFFFF"/>

  <text x="40" y="40" font-size="24" font-weight="bold" fill="#1F2937">Request Repair System — Tencent Cloud Deployment &amp; Infrastructure</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">Cloud deployment view of the event-driven architecture · Tencent Cloud · region ap-bangkok (Thailand) — low latency for local branches</text>

  <!-- Legend -->
  <g font-size="12" fill="#374151">
    <rect x="1210" y="20" width="310" height="56" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <line x1="1225" y1="38" x2="1275" y2="38" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1285" y="42">Synchronous (HTTPS / SQL / private IP)</text>
    <line x1="1225" y1="60" x2="1275" y2="60" stroke="#C2571A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
    <text x="1285" y="64">Asynchronous (Kafka events)</text>
  </g>

  <!-- USERS -->
  <text x="40" y="96" font-size="12" font-weight="bold" fill="#92700B" letter-spacing="1">INTERNET — USERS &amp; PARTNERS</text>
  <rect x="40" y="104" width="360" height="60" rx="8" fill="#FFF3CD" stroke="#B8860B"/>
  <text x="220" y="128" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">Staff Users — CS · GR · DC · ADMIN</text>
  <text x="220" y="148" font-size="11" text-anchor="middle" fill="#374151">Browser (HTTPS)</text>
  <rect x="430" y="104" width="280" height="60" rx="8" fill="#FFF3CD" stroke="#B8860B"/>
  <text x="570" y="128" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">Vendor</text>
  <text x="570" y="148" font-size="11" text-anchor="middle" fill="#374151">Email link → /print/{requestId}</text>
  <rect x="740" y="104" width="240" height="60" rx="8" fill="#FFF3CD" stroke="#B8860B" stroke-dasharray="5 4"/>
  <text x="860" y="128" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">3PL Webhook (Phase 2)</text>
  <text x="860" y="148" font-size="11" text-anchor="middle" fill="#374151">Tracking callbacks (HTTPS)</text>

  <!-- TENCENT ACCOUNT BOUNDARY -->
  <rect x="40" y="210" width="1130" height="700" rx="12" fill="#F5FBFF" stroke="#006EFF" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="60" y="236" font-size="14" font-weight="bold" fill="#006EFF">Tencent Cloud Account — region ap-bangkok (per environment: dev / uat / prod = separate projects/accounts)</text>

  <!-- Edge -->
  <rect x="70" y="252" width="1070" height="58" rx="8" fill="#E2E3E5" stroke="#6C757D"/>
  <text x="605" y="276" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">DNSPod (Cloud DNS) · CLB (Cloud Load Balancer, HTTPS) · Tencent Cloud WAF + CC protection · SSL Certificates · CDN (static)</text>
  <text x="605" y="296" font-size="11" text-anchor="middle" fill="#374151">Only public entry point — everything behind it is private</text>
  <line x1="220" y1="164" x2="220" y2="252" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="164" x2="570" y2="252" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="860" y1="164" x2="860" y2="252" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- VPC -->
  <rect x="70" y="336" width="1070" height="424" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
  <text x="90" y="358" font-size="13" font-weight="bold" fill="#0E7490">VPC (private) — app &amp; data subnets · security groups per tier · private IP only · no public IPs on workloads</text>

  <!-- TKE -->
  <rect x="90" y="372" width="600" height="368" rx="8" fill="#E8F0FE" stroke="#006EFF"/>
  <text x="390" y="396" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">TKE (Tencent Kubernetes Engine) — native/super nodes · HPA</text>
  <line x1="330" y1="310" x2="330" y2="372" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="340" font-size="10.5" fill="#6B7280">CLB → Ingress</text>

  <g font-size="11">
    <rect x="110" y="412" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#006EFF"/>
    <text x="245" y="434" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">frontend (Next.js) × N</text>
    <text x="245" y="452" text-anchor="middle" fill="#374151">Deployment + HPA</text>

    <rect x="400" y="412" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#006EFF"/>
    <text x="535" y="434" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">core-api (REST, command side) × N</text>
    <text x="535" y="452" text-anchor="middle" fill="#374151">Deployment + HPA · PgBouncer sidecar</text>

    <rect x="110" y="482" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#006EFF"/>
    <text x="245" y="504" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">outbox-relay</text>
    <text x="245" y="522" text-anchor="middle" fill="#374151">1 active + standby (leader election)</text>

    <rect x="400" y="482" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#166534"/>
    <text x="535" y="504" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">consumers: audit · read-model · document</text>
    <text x="535" y="522" text-anchor="middle" fill="#374151">consumer groups — scale by partitions</text>

    <rect x="110" y="552" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#166534"/>
    <text x="245" y="574" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">sla-monitor</text>
    <text x="245" y="592" text-anchor="middle" fill="#374151">consumer + CronJob (deadline sweep)</text>

    <rect x="400" y="552" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#166534"/>
    <text x="535" y="574" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">notification</text>
    <text x="535" y="592" text-anchor="middle" fill="#374151">email/LINE via egress · retry → DLQ</text>
  </g>
  <text x="390" y="640" font-size="11" text-anchor="middle" fill="#374151">Images from TCR (Container Registry) · secrets from SSM (Secrets Manager) · CAM roles per workload</text>
  <text x="390" y="660" font-size="11" text-anchor="middle" fill="#374151">Rolling / blue-green deploys via CODING DevOps · pods spread across availability zones</text>

  <!-- CKafka -->
  <rect x="720" y="372" width="390" height="104" rx="8" fill="#FDE2CF" stroke="#C2571A" stroke-width="2"/>
  <text x="915" y="396" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">TDMQ for CKafka (Kafka-compatible, managed)</text>
  <text x="915" y="416" font-size="11" text-anchor="middle" fill="#374151">repair.ticket / quotation / payment / sla events + DLQ</text>
  <text x="915" y="434" font-size="11" text-anchor="middle" fill="#374151">partition key = request_id · multi-AZ replicas</text>
  <text x="915" y="452" font-size="11" text-anchor="middle" fill="#374151">retention 30d · SASL auth + ACL per service</text>
  <line x1="690" y1="424" x2="720" y2="424" stroke="#C2571A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
  <text x="705" y="414" font-size="9.5" fill="#7C2D12" text-anchor="middle">pub/sub</text>

  <!-- TencentDB PostgreSQL -->
  <rect x="720" y="496" width="390" height="116" rx="8" fill="#F0E6FA" stroke="#6B21A8"/>
  <text x="915" y="520" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">TencentDB for PostgreSQL</text>
  <text x="915" y="540" font-size="11" text-anchor="middle" fill="#374151">Dual-node HA (primary + standby, auto failover) + read replica</text>
  <text x="915" y="558" font-size="11" text-anchor="middle" fill="#374151">OLTP · outbox · read models · transaction_log</text>
  <text x="915" y="576" font-size="11" text-anchor="middle" fill="#374151">Private IP only · automated backups + PITR</text>
  <text x="915" y="594" font-size="11" text-anchor="middle" fill="#374151">Reports/exports → read replica</text>
  <line x1="690" y1="554" x2="720" y2="554" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="705" y="546" font-size="9.5" fill="#6B7280" text-anchor="middle">SQL</text>

  <!-- Redis -->
  <rect x="720" y="628" width="390" height="52" rx="8" fill="#DBF4FF" stroke="#0E7490"/>
  <text x="915" y="650" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">TencentDB for Redis (HA, master-replica)</text>
  <text x="915" y="668" font-size="11" text-anchor="middle" fill="#374151">sessions · cache · locks — private IP</text>
  <line x1="690" y1="654" x2="720" y2="654" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- NAT Gateway -->
  <rect x="720" y="696" width="390" height="44" rx="8" fill="#ECECEC" stroke="#6C757D"/>
  <text x="915" y="714" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">NAT Gateway — controlled egress</text>
  <text x="915" y="731" font-size="10.5" text-anchor="middle" fill="#374151">outbound only: SES/SMTP · LINE · 3PL — no inbound</text>
  <line x1="690" y1="718" x2="720" y2="718" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- COS + platform services -->
  <rect x="70" y="784" width="350" height="102" rx="8" fill="#F0E6FA" stroke="#6B21A8"/>
  <text x="245" y="808" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">COS (Cloud Object Storage)</text>
  <text x="245" y="828" font-size="11" text-anchor="middle" fill="#374151">attachments · signatures · receipts</text>
  <text x="245" y="846" font-size="11" text-anchor="middle" fill="#374151">pre-signed URLs (browser up/download direct)</text>
  <text x="245" y="864" font-size="11" text-anchor="middle" fill="#374151">lifecycle rules · versioning · SSE encryption</text>
  <line x1="245" y1="740" x2="245" y2="784" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="260" y="766" font-size="10" fill="#6B7280">pre-signed URL issue</text>

  <rect x="450" y="784" width="690" height="102" rx="8" fill="#FFFFFF" stroke="#6C757D"/>
  <text x="795" y="808" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Platform Services</text>
  <text x="795" y="830" font-size="11" text-anchor="middle" fill="#374151">SSM Secrets Manager · TCR Container Registry · CODING DevOps (CI/CD, Terraform IaC) · CAM (IAM, least privilege)</text>
  <text x="795" y="848" font-size="11" text-anchor="middle" fill="#374151">Cloud Monitor (TCOP) / CLS Log Service / APM — p95 latency · consumer lag · DLQ depth · SLA breach alerts</text>
  <text x="795" y="866" font-size="11" text-anchor="middle" fill="#374151">Cloud Audit (operation logs) · Billing alerts per project</text>

  <!-- EXTERNAL -->
  <text x="40" y="948" font-size="12" font-weight="bold" fill="#B02A37" letter-spacing="1">EXTERNAL SERVICES (via NAT Gateway egress · HTTPS)</text>
  <rect x="40" y="958" width="260" height="70" rx="8" fill="#F8D7DA" stroke="#B02A37"/>
  <text x="170" y="984" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">Tencent SES / SMTP relay</text>
  <text x="170" y="1002" font-size="11" text-anchor="middle" fill="#374151">vendor notification email</text>
  <rect x="330" y="958" width="240" height="70" rx="8" fill="#F8D7DA" stroke="#B02A37"/>
  <text x="450" y="984" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">LINE Notify / SMS</text>
  <text x="450" y="1002" font-size="11" text-anchor="middle" fill="#374151">SLA escalation · customer pickup</text>
  <rect x="600" y="958" width="240" height="70" rx="8" fill="#F8D7DA" stroke="#B02A37" stroke-dasharray="5 4"/>
  <text x="720" y="984" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">3PL API (Phase 2)</text>
  <text x="720" y="1002" font-size="11" text-anchor="middle" fill="#374151">pickup booking · tracking</text>
  <rect x="870" y="958" width="270" height="70" rx="8" fill="#F8D7DA" stroke="#B02A37" stroke-dasharray="5 4"/>
  <text x="1005" y="984" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">ERP / Accounting (Phase 2)</text>
  <text x="1005" y="1002" font-size="11" text-anchor="middle" fill="#374151">vendor payment · cash reconciliation export</text>

  <line x1="170" y1="910" x2="170" y2="958" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="910" x2="450" y2="958" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="910" x2="720" y2="958" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1005" y1="910" x2="1005" y2="958" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Environments strip -->
  <rect x="40" y="1058" width="1130" height="56" rx="8" fill="#ECECEC" stroke="#6C757D"/>
  <text x="605" y="1081" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Environments &amp; DR</text>
  <text x="605" y="1100" font-size="11" text-anchor="middle" fill="#374151">dev / uat / prod isolated (same Terraform) · multi-AZ HA in ap-bangkok · PostgreSQL PITR + cross-region backup (ap-singapore) · COS cross-region replication (option)</text>

  <!-- RIGHT CALLOUTS -->
  <rect x="1210" y="104" width="310" height="240" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
  <text x="1365" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#0E7490">Why Tencent Cloud (TH)</text>
  <g font-size="11.5" fill="#374151">
    <text x="1226" y="156">• ap-bangkok region — data stays in Thailand,</text>
    <text x="1226" y="172">   lowest latency for branch users</text>
    <text x="1226" y="194">• TDMQ for CKafka: Kafka API-compatible —</text>
    <text x="1226" y="210">   app code identical to self-hosted Kafka</text>
    <text x="1226" y="232">• TencentDB HA/backup managed — no DBA ops</text>
    <text x="1226" y="254">• Local billing / support via TH partner</text>
    <text x="1226" y="276">• COS S3-compatible API — MinIO SDK works</text>
    <text x="1226" y="298">• Fallback: self-host Kafka on CVM if TDMQ</text>
    <text x="1226" y="314">   unavailable in region (same outbox pattern)</text>
  </g>

  <rect x="1210" y="374" width="310" height="256" rx="8" fill="#FFFFFF" stroke="#006EFF" stroke-width="1.5"/>
  <text x="1365" y="400" font-size="14" font-weight="bold" text-anchor="middle" fill="#006EFF">Scaling on Tencent Cloud</text>
  <g font-size="11.5" fill="#374151">
    <text x="1226" y="426">• HPA scales pods on CPU / RPS / consumer lag</text>
    <text x="1226" y="448">• TKE super nodes add capacity on demand</text>
    <text x="1226" y="470">• CLB absorbs spikes at the edge + CDN static</text>
    <text x="1226" y="492">• Files bypass app entirely (pre-signed URLs</text>
    <text x="1226" y="508">   direct to COS) — biggest bandwidth saver</text>
    <text x="1226" y="530">• Add CKafka partitions → consumers scale out</text>
    <text x="1226" y="552">• Read replica for reports / Excel export</text>
    <text x="1226" y="574">• ≥ 50 concurrent users (NFR) trivially met;</text>
    <text x="1226" y="590">   headroom to 1000+ without redesign</text>
    <text x="1226" y="612">• New branch/BU = data only, no infra change</text>
  </g>

  <rect x="1210" y="660" width="310" height="290" rx="8" fill="#FFFFFF" stroke="#B02A37" stroke-width="1.5"/>
  <text x="1365" y="686" font-size="14" font-weight="bold" text-anchor="middle" fill="#B02A37">Security on Tencent Cloud</text>
  <g font-size="11.5" fill="#374151">
    <text x="1226" y="712">• Single public entry: CLB + WAF + CC protect</text>
    <text x="1226" y="734">• Private subnets · security groups per tier</text>
    <text x="1226" y="756">• DB/Redis/CKafka reachable via private IP only</text>
    <text x="1226" y="778">• SSM Secrets Manager for credentials</text>
    <text x="1226" y="800">• CAM least-privilege roles per service</text>
    <text x="1226" y="822">• Pre-signed URLs expire; buckets non-public</text>
    <text x="1226" y="844">• Cloud Audit + app transaction_log</text>
    <text x="1226" y="866">• Egress restricted via NAT + security groups</text>
    <text x="1226" y="888">• Anti-DDoS basic included · SSE encryption</text>
    <text x="1226" y="904">   at rest for COS/DB</text>
    <text x="1226" y="926">• RBAC + field-level ACL enforced in core-api</text>
  </g>

  <rect x="1210" y="980" width="310" height="134" rx="8" fill="#FFFFFF" stroke="#166534" stroke-width="1.5"/>
  <text x="1365" y="1006" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">Indicative Sizing (start)</text>
  <g font-size="11.5" fill="#374151">
    <text x="1226" y="1030">frontend 2 pods · core-api 2 pods (HPA max 6)</text>
    <text x="1226" y="1050">consumers 1–2 pods each · CKafka 6 partitions</text>
    <text x="1226" y="1070">PostgreSQL 2C/8GB dual-node + replica · Redis 1GB</text>
    <text x="1226" y="1090">Scale up by config only — no code changes</text>
  </g>
</svg>
